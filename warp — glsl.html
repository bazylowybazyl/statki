<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp Tunnel - Cinematic FX</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #0055ff;
            box-shadow: 0 0 15px rgba(0, 85, 255, 0.3);
            z-index: 10;
        }
        button {
            background: #002244;
            color: #00ddff;
            border: 1px solid #00ddff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover { background: #0055ff; color: white; box-shadow: 0 0 10px #00ddff; }
        button:active { transform: scale(0.95); }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00ddff;
            text-shadow: 0 0 5px #0055ff;
            z-index: 10;
        }
        #telemetry {
            position: absolute;
            top: 20px;
            right: 20px;
            min-width: 170px;
            padding: 10px 14px;
            border: 1px solid rgba(0, 221, 255, 0.45);
            border-radius: 8px;
            background: rgba(0, 8, 20, 0.7);
            color: rgba(210, 242, 255, 0.8);
            font-size: 12px;
            line-height: 1.6;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 10;
        }
        #telemetry strong { color: #9cecff; }
        #turn-meter {
            display: inline-block;
            width: 64px;
            height: 4px;
            margin-left: 6px;
            vertical-align: middle;
            border-radius: 2px;
            background: rgba(90, 150, 190, 0.22);
            overflow: hidden;
        }
        #turn-meter-fill {
            width: 100%;
            height: 100%;
            background: #7de8ff;
            box-shadow: 0 0 8px #00bfff;
            transform: scaleX(0);
            transform-origin: center;
        }
        #instructions {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        
        #progress-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #0055ff;
            border-radius: 4px;
            display: none; 
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.2);
            z-index: 20;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: #00ddff;
            box-shadow: 0 0 15px #00ddff;
            transition: width 0.1s linear; 
        }
    </style>
</head>
<body>

    <div id="status">STATUS: IDLE</div>
    <div id="telemetry">
        <div>Warp gear: <strong id="gear-value">1 / 5</strong></div>
        <div>Turn pressure: <span id="turn-value">0%</span><span id="turn-meter"><span id="turn-meter-fill"></span></span></div>
    </div>
    <div id="instructions">[A/D] - Skręt / nacisk tunelu | [W/S] - Bieg warp | [Scroll] - Zoom podglądu</div>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="ui-container">
        <button onclick="setStage('SPOOL')">1. Ładowanie (Spool)</button>
        <button onclick="setStage('JUMP')">2. Szew -> Tunel</button>
        <button onclick="setStage('EXIT')">3. Wyjście (Exit)</button>
    </div>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Demo pozostaje look-devem; wszystkie przejścia są jednak napędzane dt,
        // żeby zachowywały się tak samo po pauzie, hitchu i spamowaniu przycisków.
        const clamp01 = (value) => Math.max(0, Math.min(1, value));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smooth01 = (value) => {
            const t = clamp01(value);
            return t * t * (3.0 - 2.0 * t);
        };
        const damp = (value, target, rate, dt) =>
            value + (target - value) * (1.0 - Math.exp(-rate * dt));

        // --- 1. SETUP SCENY ---
        const scene = new THREE.Scene();
        let globalTime = 0; 
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 25000);
        const DEFAULT_CAMERA_Y = 3600;
        const MIN_CAMERA_Y = 1000;
        const MAX_CAMERA_Y = 9000;
        let targetCameraY = DEFAULT_CAMERA_Y; 
        let baseCameraX = 0; 
        let baseCameraZ = 0; 
        camera.position.set(baseCameraX, targetCameraY, baseCameraZ);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.autoClear = false;
        document.body.appendChild(renderer.domElement);

        const shipContainer = new THREE.Group(); 
        shipContainer.position.y = 50; 
        scene.add(shipContainer);

        const uniformsShip = {
            tDiffuse: { value: null },
            uSpoolProgress: { value: 0.0 },
            uHullPulse: { value: 0.0 },
            uTime: { value: 0.0 }
        };

        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('https://raw.githubusercontent.com/bazylowybazyl/statki/refs/heads/main/assets/capital_ship_rect_v1.png', (texture) => {
            const srcW = texture.image.width;
            const srcH = texture.image.height;
            const targetLength = 2000;
            const targetWidth = targetLength * (srcH / srcW); 

            const shipGeometry = new THREE.PlaneGeometry(targetLength, targetWidth); 
            shipGeometry.rotateX(-Math.PI / 2); 
            shipGeometry.rotateY(Math.PI / 2);  

            uniformsShip.tDiffuse.value = texture;

            const shipMaterial = new THREE.ShaderMaterial({ 
                uniforms: uniformsShip,
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float uSpoolProgress;
                    uniform float uHullPulse;
                    uniform float uTime;
                    varying vec2 vUv;

                    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                    float noise(vec2 p) {
                        vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i); float b = hash(i + vec2(1.0, 0.0));
                        float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }
                    float fbm(vec2 p) {
                        float v = 0.0; float a = 0.5;
                        for (int i = 0; i < 3; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
                        return v;
                    }

                    float electricArc(vec2 uv, float time, float seed, float thickness) {
                        vec2 nUv = vec2(uv.y * 3.0, time * 6.0 + seed);
                        float n = fbm(nUv) - 0.5;
                        n += (fbm(nUv * 5.0) - 0.5) * 0.3;
                        float center = 0.5 + n * 0.8; 
                        float dist = abs(uv.x - center);
                        float yMask = smoothstep(0.05, 0.2, uv.y) * (1.0 - smoothstep(0.8, 0.95, uv.y));
                        float pulse = pow(sin(time * 30.0 + seed * 50.0) * 0.5 + 0.5, 4.0);
                        return (thickness / (dist + thickness)) * yMask * pulse;
                    }

                    void main() {
                        vec4 texColor = texture2D(tDiffuse, vUv);

                        // UV.x biegnie od sekcji silnikowej do dziobu. Energia nie
                        // zalewa już całej tekstury naraz, tylko wspina się po kadłubie.
                        float chargeFront = clamp(uSpoolProgress * 1.15, 0.0, 1.0);
                        float reached = 1.0 - smoothstep(chargeFront, chargeFront + 0.16, vUv.x);
                        float conduitWave = 0.25 + 0.75 * (
                            sin(vUv.x * 30.0 - uTime * 11.0 + vUv.y * 7.0) * 0.5 + 0.5
                        );
                        float sideFalloff = 1.0 - smoothstep(0.12, 0.34, abs(vUv.y - 0.5));
                        float energyMask = reached * conduitWave * sideFalloff * smoothstep(0.02, 0.35, uSpoolProgress);
                        energyMask += uHullPulse * (0.18 + 0.32 * conduitWave);
                        vec3 baseEnergy = vec3(0.025, 0.18, 0.42) * energyMask;

                        float arcs = 0.0;
                        vec2 hullAxisUv = vec2(vUv.y, vUv.x);
                        arcs += electricArc(hullAxisUv, uTime, 1.1, 0.0015);
                        arcs += electricArc(vec2(1.0 - hullAxisUv.x, hullAxisUv.y), uTime * 1.2, 5.5, 0.001);
                        arcs *= (smoothstep(0.55, 0.98, uSpoolProgress) * 0.72 + uHullPulse * 0.55);

                        vec3 arcColor = vec3(0.6, 0.9, 1.0) * arcs;
                        vec3 finalColor = texColor.rgb + (baseEnergy + arcColor) * texColor.a;
                        
                        gl_FragColor = vec4(finalColor, texColor.a);
                    }
                `,
                transparent: true, 
                depthWrite: false  
            });
            
            const shipMesh = new THREE.Mesh(shipGeometry, shipMaterial);
            shipMesh.renderOrder = 1; 
            
            shipContainer.add(shipMesh); 
        });

        // --- 2. SHADER TUNELU PLAZMOWEGO (FBM) ---
        const tunnelVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const tunnelFragmentShader = `
            uniform float uTime;
            uniform float uTravelOffset; 
            uniform float uFlowSpeed;      
            uniform float uRibbonScale;    
            uniform float uEnergyThreshold;
            uniform float uIntensity;
            uniform float uTwist;
            uniform float uBowFocus;
            uniform float uAlphaMult; 
            uniform float uGear;
            uniform float uGearPulse;
            uniform float uTurnPressure;
            uniform float uEntryPulse;
            uniform float uExitProgress;
            uniform vec2 uResolution;
            uniform vec2 uShipScreen;
            uniform vec3 uColorBase;
            uniform vec3 uColorBright;
            uniform float uLightning; 
            
            varying vec2 vUv;

            float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

            float noise(vec2 p, float periodX) {
                vec2 i = floor(p); vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float ix0 = mod(i.x, periodX); float ix1 = mod(i.x + 1.0, periodX);
                float a = hash(vec2(ix0, i.y)); float b = hash(vec2(ix1, i.y));
                float c = hash(vec2(ix0, i.y + 1.0)); float d = hash(vec2(ix1, i.y + 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            float fbm(vec2 p, float periodX) {
                float v = 0.0; float a = 0.5;
                for (int i = 0; i < 3; i++) {
                    v += a * noise(p, periodX);
                    p *= 2.0; periodX *= 2.0; a *= 0.5;
                }
                return v;
            }

            float electricArcTunnel(vec2 uv, float time, float seed, float thickness, float periodX) {
                vec2 nUv = vec2(uv.y * 2.0 - time * 4.0, seed);
                float n = fbm(nUv, periodX) - 0.5;
                n += sin(uv.y * 52.0 + time * 7.0 + seed * 11.0) * 0.055;
                
                float center = fract(time * 0.15 + seed + n * 0.4);
                float dist = abs(uv.x - center);
                dist = min(dist, 1.0 - dist); 
                
                float pulse = pow(abs(sin(time * 30.0 + seed * 100.0)), 6.0); 
                return (thickness / (dist + thickness)) * pulse;
            }

            void main() {
                vec2 uv = vUv;
                
                float spoolMask = smoothstep(0.30, 0.45, vUv.y) * (1.0 - smoothstep(0.55, 0.70, vUv.y));
                float bowY = 0.583; 
                float distToBow = abs(vUv.y - bowY);
                float bowTwistMask = 1.0 - smoothstep(0.0, 0.3, distToBow); 
                
                float baseTwist = mix(uTwist, uTwist * 0.1, uBowFocus);
                float localTwist = baseTwist + (bowTwistMask * uBowFocus * 0.8);

                uv.x += uv.y * localTwist;
                float longitudinal = vUv.y - bowY;
                uv.x += uTurnPressure * longitudinal * abs(longitudinal) * 0.72;
                float travel = uTravelOffset;
                uv.y -= travel;

                // Skala wstęg jest dyskretna i nie jest już lerpowana między
                // wartościami całkowitymi, więc cały wzór nie "przeskakuje".
                float stripesX = max(1.0, floor(uRibbonScale)); 
                vec2 noiseUv = vec2(uv.x * stripesX, uv.y * 3.5);
                 
                float n1 = fbm(noiseUv, stripesX);
                float n2 = fbm(noiseUv * 1.85 - vec2(0.0, travel * 0.45), stripesX * 1.85); 
                 
                float broadCloud = smoothstep(0.20, 0.76, n1);
                float filament = smoothstep(uEnergyThreshold, 0.68, n1 * n2);
                float energy = broadCloud * 0.30 + filament * 0.70;

                // Miękkie pasma kompresji dają czytelny rytm głębi. Bieg
                // zwiększa ich częstotliwość i prędkość, ale nie przepala obrazu.
                float ribDensity = mix(5.0, 10.0, clamp((uGear - 1.0) / 4.0, 0.0, 1.0));
                float ribPhase = fract((uv.y + n1 * 0.07) * ribDensity);
                float rib = exp(-pow((ribPhase - 0.5) * 5.5, 2.0));
                rib *= 0.20 + uGearPulse * 0.18 + uEntryPulse * 0.24;
                 
                float edgeFade = smoothstep(0.0, 0.2, vUv.y) * (1.0 - smoothstep(0.8, 1.0, vUv.y));
                float currentMask = mix(edgeFade, spoolMask * 1.5, uBowFocus);

                float violetMix = 0.08 + 0.04 * sin(uTime * 1.2 + n1 * 8.0);
                vec3 colorIridescent = mix(uColorBright, vec3(0.18, 0.06, 0.45), violetMix);
                vec3 finalColor = uColorBase;
                finalColor += colorIridescent * (broadCloud * 0.45 + filament * 1.15);
                 
                float arcs = 0.0;
                arcs += electricArcTunnel(uv, uTime, 0.1, 0.0011, stripesX);
                arcs += electricArcTunnel(uv, uTime, 1.8, 0.0015, stripesX);
                 
                vec3 arcColor = vec3(0.8, 0.95, 1.0) * arcs * uLightning;
                float wallSide = sin(vUv.x * 6.2831853);
                float pressureGlow = max(0.0, wallSide * uTurnPressure);
                finalColor += arcColor + vec3(0.12, 0.55, 1.3) * (rib + pressureGlow * 0.35);
                 
                float exitFade = 1.0 - smoothstep(0.02, 0.88, uExitProgress);
                vec2 screenUv = gl_FragCoord.xy / uResolution;
                vec2 shipDelta = (screenUv - uShipScreen) / vec2(0.17, 0.34);
                float readabilityBubble = smoothstep(0.72, 1.12, length(shipDelta));
                float alpha = (
                    energy * uIntensity +
                    rib * uIntensity +
                    arcs * uLightning * 0.35 +
                    pressureGlow * uIntensity * 0.2
                ) * currentMask * uAlphaMult * exitFade;
                alpha *= mix(0.30, 1.0, readabilityBubble);
                alpha = clamp(alpha, 0.0, 1.0);

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        function createUniforms(alpha) {
            return {
                uTime: { value: 0.0 },
                uTravelOffset: { value: 0.0 },
                uFlowSpeed: { value: 0.0 },       
                uRibbonScale: { value: 12.0 },    
                uEnergyThreshold: { value: 0.15 }, 
                uIntensity: { value: 0.0 },
                uTwist: { value: 0.0 },
                uBowFocus: { value: 0.0 }, 
                uAlphaMult: { value: alpha }, 
                uGear: { value: 1.0 },
                uGearPulse: { value: 0.0 },
                uTurnPressure: { value: 0.0 },
                uEntryPulse: { value: 0.0 },
                uExitProgress: { value: 0.0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uShipScreen: { value: new THREE.Vector2(0.5, 0.5) },
                uLightning: { value: 0.0 }, 
                uColorBase: { value: new THREE.Color().setRGB(0.003, 0.018, 0.075) }, 
                uColorBright: { value: new THREE.Color().setRGB(0.04, 0.36, 1.0) } 
            };
        }

        const uniformsBack = createUniforms(1.0); 
        const uniformsFront = createUniforms(0.22); 

        const tunnelOuterGeo = new THREE.CylinderGeometry(4200, 4200, 18000, 96, 1, true);
        tunnelOuterGeo.rotateX(Math.PI / 2);
        tunnelOuterGeo.rotateZ(Math.PI / 2);
        const tunnelInnerGeo = new THREE.CylinderGeometry(3520, 3520, 18000, 96, 1, true);
        tunnelInnerGeo.rotateX(Math.PI / 2);
        tunnelInnerGeo.rotateZ(Math.PI / 2);

        const tunnelBackMaterial = new THREE.ShaderMaterial({
            vertexShader: tunnelVertexShader,
            fragmentShader: tunnelFragmentShader,
            uniforms: uniformsBack,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending, 
            depthWrite: false 
        });
        const tunnelBack = new THREE.Mesh(tunnelOuterGeo, tunnelBackMaterial);
        tunnelBack.renderOrder = 0; 
        tunnelBack.visible = false;
        scene.add(tunnelBack);

        const tunnelFrontMaterial = new THREE.ShaderMaterial({
            vertexShader: tunnelVertexShader,
            fragmentShader: tunnelFragmentShader,
            uniforms: uniformsFront,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending, 
            depthWrite: false 
        });
        const tunnelFront = new THREE.Mesh(tunnelInnerGeo, tunnelFrontMaterial);
        tunnelFront.renderOrder = 2; 
        tunnelFront.visible = false;
        scene.add(tunnelFront);

        // --- 2B. KOTWICA SZEWU PRZESTRZENI ---
        // Sam efekt jest generowany w postprocessie z obrazu całej sceny. Pusta
        // grupa daje mu pozycję świata oraz dwie osie projekcji na ekran.
        const foldGroup = new THREE.Group();
        foldGroup.position.set(0, 28, -1150);
        scene.add(foldGroup);
        const riftProjectedCenter = new THREE.Vector3();
        const riftProjectedAxisX = new THREE.Vector3();
        const riftProjectedAxisY = new THREE.Vector3();
        const riftProjectedShip = new THREE.Vector3();


        // --- 3A. UNIWERSALNE ZAAWANSOWANE ISKRY (OPLOT + TUNEL + DETACH) ---
        const sparkBaseGeo = new THREE.PlaneGeometry(1, 1);
        sparkBaseGeo.translate(0, 0.5, 0); 

        const sparkCount = 2400; 
        const sparkGeoInst = new THREE.InstancedBufferGeometry().copy(sparkBaseGeo);
        sparkGeoInst.instanceCount = sparkCount;

        const spOffsets = new Float32Array(sparkCount * 3); 
        const spData = new Float32Array(sparkCount * 3);    
        const spColors = new Float32Array(sparkCount * 3);

        const cCyan = new THREE.Color(0x00e5ff);
        const cBlue = new THREE.Color(0x0055ff);
        const cWhite = new THREE.Color(0xffffff);

        for (let i = 0; i < sparkCount; i++) {
            spOffsets[i * 3 + 0] = Math.random() * Math.PI * 2;
            spOffsets[i * 3 + 1] = (Math.random() - 0.5) * 12000; 
            spOffsets[i * 3 + 2] = Math.random(); 
            
            spData[i * 3 + 0] = Math.random() * Math.PI * 2;
            spData[i * 3 + 1] = 6.0 + Math.random() * 12.0;   
            spData[i * 3 + 2] = 40.0 + Math.random() * 100.0; 
            
            let c = Math.random() > 0.5 ? cCyan : cBlue;
            if (Math.random() > 0.85) c = cWhite;
            spColors[i*3+0] = c.r; spColors[i*3+1] = c.g; spColors[i*3+2] = c.b;
        }

        sparkGeoInst.setAttribute('aOffset', new THREE.InstancedBufferAttribute(spOffsets, 3));
        sparkGeoInst.setAttribute('aData', new THREE.InstancedBufferAttribute(spData, 3));
        sparkGeoInst.setAttribute('aColor', new THREE.InstancedBufferAttribute(spColors, 3)); 

        const uniformsSparks = {
            uTime: { value: 0.0 },
            uTravelOffset: { value: 0.0 }, 
            uIntensity: { value: 0.0 },
            uTwist: { value: 0.0 },
            uBowFocus: { value: 0.0 },
            uVisualSpeed: { value: 0.0 },
            uExitProgress: { value: 0.0 },
            uGear: { value: 1.0 },
            uGearPulse: { value: 0.0 },
            uTurnPressure: { value: 0.0 }
        };

        const sparkMaterial = new THREE.ShaderMaterial({
            uniforms: uniformsSparks,
            vertexShader: `
                uniform float uTime;
                uniform float uTravelOffset;
                uniform float uTwist;
                uniform float uBowFocus;
                uniform float uIntensity;
                uniform float uVisualSpeed;
                uniform float uExitProgress;
                uniform float uGear;
                uniform float uGearPulse;
                uniform float uTurnPressure;

                attribute vec3 aOffset; 
                attribute vec3 aData;   
                attribute vec3 aColor;

                varying vec3 vColor;
                varying vec2 vUv;
                varying float vAlpha;
                varying float vPhase;

                void main() {
                    vUv = uv;
                    vColor = aColor;
                    vPhase = aData.x;

                    float len = 12000.0;
                    
                    float travel = uTravelOffset * len;
                    float shiftedZ = (aOffset.y + travel) + len / 2.0;
                    
                    float wrappedZ = (shiftedZ - len * floor(shiftedZ / len)) - len / 2.0;

                    float spoolBulge = smoothstep(-1500.0, 1500.0, wrappedZ); 
                    float spoolRadius = mix(150.0 + aOffset.z * 80.0, 480.0 + aOffset.z * 150.0, spoolBulge);
                    
                    float tunnelBulge = smoothstep(-2000.0, 4000.0, wrappedZ); 
                    float tunnelRadius = mix(1050.0 + aOffset.z * 650.0, 2100.0 + aOffset.z * 1050.0, tunnelBulge);
                    
                    float currentRadius = mix(tunnelRadius, spoolRadius, uBowFocus);

                    float orbitAngle = aOffset.x + uTime * 4.0 * uBowFocus;
                    vec3 pos = vec3(cos(orbitAngle) * currentRadius, sin(orbitAngle) * currentRadius, wrappedZ);

                    float uvY = 0.5 - (pos.z / len);
                    float distToBow = abs(uvY - 0.583);
                    float bowTwistMask = 1.0 - smoothstep(0.0, 0.2, distToBow);
                    float localTwist = uTwist + (bowTwistMask * uBowFocus * 15.0);
                    float angleRot = uvY * localTwist * 6.2831853; 
                    
                    float c = cos(angleRot);
                    float s = sin(angleRot);
                    float nx = pos.x * c - pos.y * s;
                    float ny = pos.x * s + pos.y * c;
                    pos.x = nx;
                    pos.y = ny;
                    float bendDepth = wrappedZ / (len * 0.5);
                    pos.x += uTurnPressure * bendDepth * abs(bendDepth) * 720.0;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);

                    float spiralPower = 1.6 * uBowFocus; 
                    vec3 localForward = normalize(vec3(
                        -sin(orbitAngle) * spiralPower,
                        cos(orbitAngle) * spiralPower,
                        1.0 
                    ));
                    
                    vec3 viewForward = normalize((modelViewMatrix * vec4(localForward, 0.0)).xyz);

        const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);

        const ppMaterial = new THREE.ShaderMaterial({
            uniforms: uniformsPP,
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAberration;
                uniform float uRadialBlur;
                uniform float uFlash;
                uniform vec2 uCenter;
                uniform float uAspect;
                uniform vec2 uTexelSize;
                uniform vec2 uShipScreen;
                uniform vec2 uShipSafeRadius;
                uniform vec2 uRiftCenter;
                uniform vec2 uRiftAxisX;
                uniform vec2 uRiftAxisY;
                uniform float uRiftVisibility;
                uniform float uRiftOpen;
                uniform float uRiftSpan;
                uniform float uRiftLens;
                uniform float uRiftPulse;
                uniform float uRiftTurnPressure;
                uniform float uTime;
                varying vec2 vUv;

                float cross2(vec2 a, vec2 b) {
                    return a.x * b.y - a.y * b.x;
                }

                float riftHash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                }

                float riftNoise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    float a = riftHash(i);
                    float b = riftHash(i + vec2(1.0, 0.0));
                    float c = riftHash(i + vec2(0.0, 1.0));
                    float d = riftHash(i + vec2(1.0, 1.0));
                    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                }

                float riftFbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    for (int octave = 0; octave < 3; octave++) {
                        value += riftNoise(p) * amplitude;
                        p = p * 2.03 + vec2(17.1, 9.2);
                        amplitude *= 0.5;

                    float riftCore = 0.0;
                    float riftPhoton = 0.0;
                    float riftCorona = 0.0;
                    float riftEcho = 0.0;
                    float riftShock = 0.0;
                    float riftAccretion = 0.0;
                    float riftWave = 0.0;
                    float gravityShadow = 0.0;
                    float secondaryMix = 0.0;
                    float caustic = 0.0;

                    vec2 mirrorUv = uv;

                        float span = clamp(uRiftSpan, 0.025, 1.0);
                        float domainWarp =
                            (riftFbm(vec2(
                                p.y * 1.7 + uTime * 0.045,
                                -1.8
                            )) - 0.5) *
                            0.11 *
                            open;
                        p.x += domainWarp;
                        float xn = abs(p.x) / span;
                        float cap = pow(
                            max(0.0, 1.0 - pow(min(xn, 1.0), 4.0)),
                            0.70
                        );

                        // Otwarcie rozchodzi się od środka ku końcom. Dwie
                        // krawędzie korzystają z niezależnych pól szumu.
                        float propagation = smoothstep(
                            xn * 0.62,
                            xn * 0.62 + 0.20,
                            open
                        );
                        float curveNoise = riftFbm(vec2(p.x * 2.4 - uTime * 0.07, 2.7)) - 0.5;
                        float upperNoise = riftFbm(vec2(p.x * 7.7 - uTime * 0.16, 7.1)) - 0.5;
                        float lowerNoise = riftFbm(vec2(p.x * 9.1 + uTime * 0.13, -3.4)) - 0.5;
                        float curve =
                            -0.03 +
                            0.10 * p.x * p.x +
                            curveNoise * 0.09 +
                            p.x * uRiftTurnPressure * 0.03;

                        float halfGap =
                            (0.004 + 0.29 * pow(open, 0.72) * propagation) *
                            cap;
                        float upperEdge =
                            curve +
                            halfGap * 0.91 +
                            upperNoise * 0.082 * open * cap;
                        float lowerEdge =
                            curve -
                            halfGap * 1.08 +
                            lowerNoise * 0.105 * open * cap;

                        float signedEdge = max(
                            p.y - upperEdge,
                            lowerEdge - p.y
                        );
                        float edgeDistance = abs(signedEdge);
                        float outside = max(signedEdge, 0.0);
                        float spanMask =
                            (1.0 - smoothstep(
                                max(0.0, span - 0.065),
                                span + 0.035,
                                abs(p.x)
                            )) *
                            (1.0 - smoothstep(1.05, 1.55, abs(p.y)));
                        float localMask =
                            (1.0 - smoothstep(1.08, 1.34, abs(p.x))) *
                            (1.0 - smoothstep(1.10, 1.60, abs(p.y)));

                        float aa = 0.006;
                        riftCore =
                            (1.0 - smoothstep(-aa, aa, signedEdge)) *
                            spanMask * valid;

                        float photonProfile = exp2(-pow(edgeDistance / 0.020, 2.0));
                        float causticNoise = riftFbm(vec2(
                            p.x * 11.0 - uTime * 0.42,
                            (p.y > curve ? 3.7 : -3.7) + uTime * 0.06
                        ));
                        caustic = smoothstep(0.58, 0.79, causticNoise);
                        float doppler = mix(
                            0.58,
                            1.42,
                            smoothstep(-span, span, p.x)
                        );
                        riftPhoton =
                            photonProfile *
                            (0.025 + caustic * 1.46) *
                            doppler *
                            (p.y > curve ? 1.0 : 0.48) *
                            spanMask *
                            valid;

                            exp(-outside * 6.8) *
                            (1.0 - riftCore) *
                            spanMask *
                            valid;
                        riftEcho =
                            exp(-abs(signedEdge - 0.095) * 43.0) *
                            caustic *
                            spanMask *
                            valid;

                            p.x * 5.4 + uTime * 0.11,
                            p.y * 2.2 - uTime * 0.045

                            0.125 +
                            0.030 * sin(
                                p.x * 6.7 -
                                uTime * 0.52 +
                                contourNoise * 5.0

                        riftAccretion =
                            exp(-abs(signedEdge - accretionOffset) * 22.0) *
                            smoothstep(0.49, 0.76, contourNoise) *
                            spanMask *
                            valid;
                        float wavePattern =
                            0.5 +
                            0.5 * sin(
                                outside * 47.0 -
                                uTime * 1.15 +
                                p.x * 3.1 +
                                contourNoise * 5.5
                            );
                        riftWave =
                            pow(wavePattern, 7.0) *
                            exp(-outside * 3.8) *
                            (1.0 - riftCore) *
                            spanMask *
                            valid;
                        gravityShadow =
                            exp(-outside * 2.9) *
                            spanMask *
                            localMask *
                            valid;

                        float ellipseRadius = length(vec2(
                            p.x / max(span, 0.025),
                            (p.y - curve) / 0.62
                        ));
                        riftShock =
                            exp(-abs(ellipseRadius - (1.05 + uRiftPulse * 0.42)) * 24.0) *
                            uRiftPulse *
                            spanMask *
                            valid;

                        float side = p.y >= curve ? 1.0 : -1.0;
                        float curveSlope =
                            0.20 * p.x +
                            uRiftTurnPressure * 0.03;

                            uRiftAxisY * side -
                            uRiftAxisX * curveSlope * 0.22;
                        vec2 normalMetric = normalRaw * vec2(max(uAspect, 0.1), 1.0);

                            max(dot(normalMetric, normalMetric), 0.00000001)

                        vec2 normalUv =
                            normalMetric * invNormalLength /
                            vec2(max(uAspect, 0.1), 1.0);

                        vec2 tangentMetric =
                            uRiftAxisX * vec2(max(uAspect, 0.1), 1.0);
                        float invTangentLength = inversesqrt(
                            max(dot(tangentMetric, tangentMetric), 0.00000001)
                        );
                        vec2 tangentUv =
                            tangentMetric * invTangentLength /
                            vec2(max(uAspect, 0.1), 1.0);

                        vec2 shipP =
                            (uv - uShipScreen) /
                            max(uShipSafeRadius, vec2(0.001));
                        float shipProtection =
                            smoothstep(0.72, 1.12, length(shipP));
                        float screenEdge = min(
                            min(uv.x, 1.0 - uv.x),
                            min(uv.y, 1.0 - uv.y)
                        );
                        float edgeProtection = smoothstep(0.015, 0.055, screenEdge);
                        float lensBand =
                            (1.0 - smoothstep(0.02, 0.46, outside)) *
                            step(0.0, signedEdge) *
                            spanMask *
                            localMask;
                        float ripple =
                            0.88 +
                            0.12 * sin(p.x * 19.0 - uTime * 1.35 + curveNoise * 8.0);
                        float lensStrength =
                            clamp(uRiftLens, 0.0, 1.0) *
                            riftActive *
                            lensBand *
                            shipProtection *
                            edgeProtection *
                            valid;
                        float lensAmount =
                            mix(0.0045, 0.023, open) *
                            lensStrength *
                            ripple;
                        vec2 lensOffset =
                            normalUv * lensAmount +
                            tangentUv * side * lensStrength * 0.0040;
                        vec2 border = max(uTexelSize * 1.5, vec2(0.0001));
                        sceneUv = clamp(uv + lensOffset, border, vec2(1.0) - border);
                        mirrorUv = clamp(
                            sceneUv - normalUv * lensAmount * (1.6 + open * 1.7),
                            border,
                            vec2(1.0) - border
                        );
                        secondaryMix = clamp(
                            lensStrength * open * (0.045 + caustic * 0.15),
                            0.0,
                            0.22
                        );
                        }
                    }

                    vec2 uvDir = uv - uCenter;
                    vec2 metricDir = uvDir * vec2(uAspect, 1.0);
                    float dist = length(metricDir);
                    float comfortMask = smoothstep(0.10, 0.52, dist);
                    vec2 chromaDir = dist > 0.0001
                        ? normalize(metricDir) / vec2(uAspect, 1.0)
                        : vec2(0.0);
                    float shift = uAberration * dist * dist * 0.012 * comfortMask;
                    float blurAmount = uRadialBlur * 0.035 * comfortMask;

                    vec3 color;
                    if (uRadialBlur < 0.0005 && uAberration < 0.0005) {
                        color = texture2D(tDiffuse, sceneUv).rgb;
                    } else if (uRadialBlur < 0.0005) {
                        color = vec3(
                            texture2D(tDiffuse, sceneUv + chromaDir * shift).r,
                            texture2D(tDiffuse, sceneUv).g,
                            texture2D(tDiffuse, sceneUv - chromaDir * shift).b
                        );
                    } else {
                        color = vec3(0.0);
                        const int samples = 7;
                        for(int i = 0; i < samples; i++) {
                            float f = float(i) / float(samples - 1);
                            vec2 sampleUv = sceneUv - uvDir * (f * blurAmount);
                            color += vec3(
                                texture2D(tDiffuse, sampleUv + chromaDir * shift).r,
                                texture2D(tDiffuse, sampleUv).g,
                                texture2D(tDiffuse, sampleUv - chromaDir * shift).b
                            );
                        }
                        color /= float(samples);
                    }

                    if (riftActive > 0.0005) {
                        vec3 secondaryImage = texture2D(tDiffuse, mirrorUv).rgb;
                        color = mix(color, secondaryImage, secondaryMix);
                        color *= 1.0 - gravityShadow * riftActive * (0.14 + uRiftOpen * 0.18);
                        color = mix(
                            color,
                            vec3(0.0002, 0.0005, 0.0020),
                            riftCore * riftActive * 0.985
                        );

                        vec3 photonColor =
                            vec3(0.72, 1.30, 2.30) * riftPhoton;
                        photonColor +=
                            vec3(0.24, 0.08, 0.68) *
                            riftPhoton *
                            caustic *
                            0.18;
                        vec3 coronaColor =
                            vec3(0.012, 0.13, 0.56) *
                            riftCorona *
                            0.38;
                        vec3 echoColor =
                            vec3(0.12, 0.32, 0.92) *
                            riftEcho *
                            0.20;
                        vec3 shockColor =
                            vec3(0.08, 0.42, 1.05) *
                            riftShock *
                            0.30;
                        vec3 accretionColor =
                            vec3(0.035, 0.26, 0.92) *
                            riftAccretion *
                            0.62;
                        accretionColor +=
                            vec3(0.18, 0.035, 0.52) *
                            riftAccretion *
                            caustic *
                            0.12;
                        vec3 waveColor =
                            vec3(0.008, 0.075, 0.34) *
                            riftWave *
                            0.27;
                        color +=
                            (
                                photonColor +
                                coronaColor +
                                echoColor +
                                shockColor +
                                accretionColor +
                                waveColor
                            ) *
                            riftActive;
                    }

                    color = mix(color, vec3(0.82, 0.94, 1.0), clamp(uFlash, 0.0, 0.35));
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });
        
        const orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ppMaterial);
        orthoScene.add(orthoQuad);


        // --- 5. STEROWANIE ---
        const keys = { a: false, d: false };
        let warpGear = 3;
        let gearPulse = 0.0;
        const gearProfiles = {
            1: { flowRate: 4.8, ribCount: 5.0, intensity: 0.54 },
            2: { flowRate: 6.4, ribCount: 6.0, intensity: 0.58 },
            3: { flowRate: 8.0, ribCount: 7.0, intensity: 0.62 },
            4: { flowRate: 9.8, ribCount: 8.0, intensity: 0.67 },
            5: { flowRate: 11.8, ribCount: 9.0, intensity: 0.72 }
        };

        const gearValueEl = document.getElementById('gear-value');
        const turnValueEl = document.getElementById('turn-value');
        const turnMeterFill = document.getElementById('turn-meter-fill');

        function updateGear(direction) {
            const nextGear = Math.max(1, Math.min(5, warpGear + direction));
            if (nextGear === warpGear) return;
            warpGear = nextGear;
            gearPulse = 1.0;
            uniformsShip.uHullPulse.value = Math.max(uniformsShip.uHullPulse.value, 0.32);
            gearValueEl.textContent = warpGear + ' / 5';
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a') keys.a = true;
            if (key === 'd') keys.d = true;
            if (!e.repeat && key === 'w') updateGear(1);
            if (!e.repeat && key === 's') updateGear(-1);
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a') keys.a = false;
            if (key === 'd') keys.d = false;
        });

        function releaseSteering() {
            keys.a = false;
            keys.d = false;
        }

        window.addEventListener('blur', releaseSteering);
        document.addEventListener('visibilitychange', () => {
            releaseSteering();
            clock.getDelta();
        });

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetCameraY += e.deltaY * 4.0; 
            targetCameraY = Math.max(
                MIN_CAMERA_Y,
                Math.min(targetCameraY, MAX_CAMERA_Y)
            );
        }, { passive: false });

        let currentDrift = 0.0;
        let targetDrift = 0.0;
        let flowHeading = 0.0;
        let turnPressure = 0.0;
        let currentCameraY = targetCameraY;

        function shakeHash(index, channel) {
            let value = Math.imul(
                (index + Math.imul(channel, 1013)) | 0,
                0x45d9f3b
            );
            value ^= value >>> 16;
            value = Math.imul(value, 0x45d9f3b);
            value ^= value >>> 16;
            return (value >>> 0) / 4294967295 * 2.0 - 1.0;
        }

        function shakeNoise(time, channel) {
            const index = Math.floor(time);
            const phase = time - index;
            const blend = phase * phase * (3.0 - 2.0 * phase);
            return lerp(
                shakeHash(index, channel),
                shakeHash(index + 1, channel),
                blend
            );
        }

        // --- 6. MASZYNA STANÓW ---
        const STAGE_TARGETS = {
            IDLE: {
                speed: 0.0, flowSpeed: 0.0, ribbonScale: 8.0,
                energyThreshold: 0.42, intensity: 0.0, twist: 0.0,
                bowFocus: 0.0, aberration: 0.0, radialBlur: 0.0,
                shake: 0.0, lightning: 0.0
            },
            SPOOL: {
                speed: 0.1, flowSpeed: 0.0, ribbonScale: 8.0,
                energyThreshold: 0.62, intensity: 0.0, twist: 0.0,
                bowFocus: 1.0, aberration: 0.0, radialBlur: 0.0,
                shake: 0.0, lightning: 0.0
            },
            JUMP: {
                speed: 0.3, flowSpeed: 0.0, ribbonScale: 8.0,
                energyThreshold: 0.46, intensity: 0.20, twist: 0.04,
                bowFocus: 0.0, aberration: 0.0, radialBlur: 0.0,
                shake: 0.0, lightning: 0.02
            },
            TUNNEL: {
                speed: 8.0, flowSpeed: 0.0, ribbonScale: 8.0,
                energyThreshold: 0.36, intensity: 0.62, twist: 0.13,
                bowFocus: 0.0, aberration: 0.0, radialBlur: 0.0,
                shake: 0.0, lightning: 0.08
            },
            EXIT: {
                speed: 6.0, flowSpeed: 0.0, ribbonScale: 8.0,
                energyThreshold: 0.38, intensity: 0.62, twist: 0.10,
                bowFocus: 0.0, aberration: 0.18, radialBlur: 0.10,
                shake: 0.0, lightning: 0.05
            },
            RECOVERY: {
                speed: 0.0, flowSpeed: 0.0, ribbonScale: 8.0,
                energyThreshold: 0.42, intensity: 0.0, twist: 0.0,
                bowFocus: 0.0, aberration: 0.0, radialBlur: 0.0,
                shake: 0.0, lightning: 0.0
            }
        };

        const target = { ...STAGE_TARGETS.IDLE };
        const statusEl = document.getElementById('status');
        const progressBarContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        const SPOOL_DURATION = 2.8;
        const JUMP_DURATION = 1.65;
        const EXIT_DURATION = 0.62;
        const RECOVERY_DURATION = 0.53;

        let currentStage = 'IDLE';
        let stageElapsed = 0.0;
        let stagePulseFired = false;
        let currentFlash = 0.0;
        let currentShake = 0.0;
        let currentVisualSpeed = 0.0;
        let globalTravelOffset = 0.0;
        let currentRiftVisibility = 0.0;
        let currentRiftOpen = 0.0;
        let currentRiftSpan = 0.05;
        let currentRiftLens = 0.0;
        let currentRiftPulse = 0.0;
        let currentRiftScale = 1.0;

        function setStage(stage) {
            if (!STAGE_TARGETS[stage]) return;

            currentStage = stage;
            stageElapsed = 0.0;
            stagePulseFired = false;
            Object.assign(target, STAGE_TARGETS[stage]);
            statusEl.textContent = 'STATUS: ' + stage;
            progressBarContainer.style.display = stage === 'SPOOL' ? 'block' : 'none';

            if (stage === 'SPOOL') {
                progressBar.style.width = '0%';
            }

            if (stage === 'EXIT') {
                uniformsWake.uShootTime.value = globalTime;
                currentShake = Math.max(currentShake, 0.18);
            } else if (stage !== 'RECOVERY') {
                uniformsWake.uShootTime.value = -999.0;
            }
        }

        function updateStageTargets() {
            const profile = gearProfiles[warpGear];
            let desiredSpool = 0.0;
            let desiredExit = 0.0;
            let desiredEntryPulse = 0.0;
            let desiredRiftVisibility = 0.0;
            let desiredRiftOpen = 0.0;
            let desiredRiftSpan = 0.05;
            let desiredRiftLens = 0.0;
            let desiredRiftPulse = 0.0;
            let desiredRiftScale = 1.0;

            if (currentStage === 'SPOOL') {
                const progress = clamp01(stageElapsed / SPOOL_DURATION);
                const riftBirth = smooth01((progress - 0.72) / 0.12);
                const riftStretch = smooth01((progress - 0.82) / 0.15);
                desiredSpool = progress * 0.12;
                progressBar.style.width = (progress * 100.0).toFixed(1) + '%';

                target.speed = lerp(0.02, 0.30, progress);
                target.intensity = lerp(0.0, 0.14, smooth01(progress));
                target.twist = lerp(0.0, 0.42, smooth01(progress));
                target.energyThreshold = lerp(0.62, 0.48, progress);

                desiredRiftVisibility =
                    riftBirth * 0.16 +
                    riftStretch * 0.56;
                desiredRiftOpen = riftBirth * 0.018;
                desiredRiftSpan = lerp(
                    0.05,
                    0.72,
                    smooth01(riftBirth * 0.42 + riftStretch * 0.58)
                );
                desiredRiftLens = riftBirth * 0.42;
            } else if (currentStage === 'JUMP') {
                const rupture = smooth01((stageElapsed - 0.12) / 0.58);
                const reveal = smooth01((stageElapsed - 0.94) / 0.46);
                const ingress = smooth01((stageElapsed - 1.10) / 0.42);
                const riftFade = smooth01((stageElapsed - 1.37) / 0.24);
                const pulseOffset = (stageElapsed - 0.53) / 0.105;
                const rupturePulse = Math.exp(-pulseOffset * pulseOffset);

                desiredSpool =
                    0.12 *
                    (1.0 - smooth01((stageElapsed - 0.04) / 0.36));
                desiredRiftVisibility =
                    lerp(0.72, 1.0, rupture) *
                    (1.0 - riftFade);
                desiredRiftOpen = rupture;
                desiredRiftSpan = lerp(0.72, 1.0, rupture);
                desiredRiftLens =
                    lerp(0.42, 1.0, rupture) *
                    (1.0 - riftFade * 0.55);
                desiredRiftPulse = rupturePulse;
                desiredRiftScale = 1.0 + ingress * 2.45;
                desiredEntryPulse =
                    rupturePulse * 0.65 +
                    ingress * 0.35;

                target.speed = lerp(0.30, profile.flowRate + 2.5, ingress);
                target.intensity = lerp(0.20, profile.intensity, reveal);
                target.energyThreshold = lerp(0.46, 0.36, reveal);
                target.lightning = lerp(0.02, 0.08, reveal);
                target.aberration = rupturePulse * 0.055 + ingress * 0.035;
                target.radialBlur = rupturePulse * 0.035 + ingress * 0.07;
            } else if (currentStage === 'TUNNEL') {
                target.speed = profile.flowRate * (1.0 + gearPulse * 0.16);
                target.intensity = profile.intensity * (1.0 + gearPulse * 0.08);
                target.energyThreshold = 0.38 - (warpGear - 1) * 0.008;
                target.lightning = 0.08;
            } else if (currentStage === 'EXIT') {
                const flowStop = smooth01((stageElapsed - 0.08) / 0.40);
                const tunnelClose = smooth01((stageElapsed - 0.12) / 0.40);

                target.speed = profile.flowRate * (1.0 - flowStop);
                target.intensity = (profile.intensity + 0.12 * (1.0 - smooth01(stageElapsed / 0.08)))
                    * (1.0 - tunnelClose);
                target.aberration = 0.18 * (1.0 - smooth01(stageElapsed / 0.45));
                target.radialBlur = 0.10 * (1.0 - smooth01(stageElapsed / 0.42));

                desiredExit = tunnelClose;
                desiredRiftVisibility =
                    smooth01((stageElapsed - 0.02) / 0.10) *
                    (1.0 - smooth01((stageElapsed - 0.46) / 0.16));
                desiredRiftOpen =
                    1.0 -
                    smooth01((stageElapsed - 0.04) / 0.28);
                desiredRiftSpan = 0.92;
                desiredRiftLens =
                    0.72 *
                    (1.0 - smooth01((stageElapsed - 0.30) / 0.24));
                const exitPulseOffset = (stageElapsed - 0.24) / 0.075;
                desiredRiftPulse = Math.exp(-exitPulseOffset * exitPulseOffset) * 0.62;

                if (!stagePulseFired && stageElapsed >= 0.25) {
                    stagePulseFired = true;
                    currentFlash = Math.max(currentFlash, 0.08);
                }
            } else if (currentStage === 'RECOVERY') {
                desiredExit = 1.0;
            }

            uniformsShip.uSpoolProgress.value = damp(
                uniformsShip.uSpoolProgress.value,
                desiredSpool,
                currentStage === 'SPOOL' ? 5.0 : 8.0,
                frameDelta
            );
            currentRiftVisibility = damp(
                currentRiftVisibility,
                desiredRiftVisibility,
                13.0,
                frameDelta
            );
            currentRiftOpen = damp(currentRiftOpen, desiredRiftOpen, 15.0, frameDelta);
            currentRiftSpan = damp(currentRiftSpan, desiredRiftSpan, 12.0, frameDelta);
            currentRiftLens = damp(currentRiftLens, desiredRiftLens, 12.0, frameDelta);
            currentRiftPulse = desiredRiftPulse;
            currentRiftScale = damp(currentRiftScale, desiredRiftScale, 8.0, frameDelta);

            uniformsBack.uExitProgress.value = desiredExit;
            uniformsFront.uExitProgress.value = desiredExit;
            uniformsSparks.uExitProgress.value = desiredExit;
            uniformsBack.uEntryPulse.value = desiredEntryPulse;
            uniformsFront.uEntryPulse.value = desiredEntryPulse;
        }

        function projectRiftToPostprocess() {
            camera.updateMatrixWorld(true);
            foldGroup.updateMatrixWorld(true);
            shipContainer.updateMatrixWorld(true);

            riftProjectedCenter.set(0.0, 0.0, 0.0);
            foldGroup.localToWorld(riftProjectedCenter);
            riftProjectedCenter.project(camera);

            riftProjectedAxisX.set(1400.0 * currentRiftScale, 0.0, 0.0);
            foldGroup.localToWorld(riftProjectedAxisX);
            riftProjectedAxisX.project(camera);

            riftProjectedAxisY.set(0.0, 0.0, -520.0 * currentRiftScale);
            foldGroup.localToWorld(riftProjectedAxisY);
            riftProjectedAxisY.project(camera);

            riftProjectedShip.set(0.0, 0.0, 0.0);
            shipContainer.localToWorld(riftProjectedShip);
            riftProjectedShip.project(camera);

            const centerX = riftProjectedCenter.x * 0.5 + 0.5;
            const centerY = riftProjectedCenter.y * 0.5 + 0.5;
            const axisXX = (riftProjectedAxisX.x - riftProjectedCenter.x) * 0.5;
            const axisXY = (riftProjectedAxisX.y - riftProjectedCenter.y) * 0.5;
            const axisYX = (riftProjectedAxisY.x - riftProjectedCenter.x) * 0.5;
            const axisYY = (riftProjectedAxisY.y - riftProjectedCenter.y) * 0.5;
            const determinant = axisXX * axisYY - axisXY * axisYX;
            const projectionValid =
                Number.isFinite(centerX) &&
                Number.isFinite(centerY) &&
                Number.isFinite(axisXX) &&
                Number.isFinite(axisXY) &&
                Number.isFinite(axisYX) &&
                Number.isFinite(axisYY) &&
                Math.abs(determinant) > 0.00001 &&
                riftProjectedCenter.z >= -1.0 &&
                riftProjectedCenter.z <= 1.0;

            uniformsPP.uRiftCenter.value.set(centerX, centerY);
            uniformsPP.uRiftAxisX.value.set(axisXX, axisXY);
            uniformsPP.uRiftAxisY.value.set(axisYX, axisYY);
            uniformsPP.uShipScreen.value.set(
                riftProjectedShip.x * 0.5 + 0.5,
                riftProjectedShip.y * 0.5 + 0.5
            );
            uniformsPP.uRiftVisibility.value =
                projectionValid ? currentRiftVisibility : 0.0;
            uniformsPP.uRiftOpen.value = currentRiftOpen;
            uniformsPP.uRiftSpan.value = currentRiftSpan;
            uniformsPP.uRiftLens.value = currentRiftLens;
            uniformsPP.uRiftPulse.value = currentRiftPulse;
            uniformsPP.uRiftTurnPressure.value = turnPressure;
            uniformsPP.uTime.value = globalTime;
        }

        // --- 7. PĘTLA RENDEROWANIA ---
        const clock = new THREE.Clock();
        let frameDelta = 0.0;

        function animate() {
            requestAnimationFrame(animate);
            frameDelta = Math.min(clock.getDelta(), 0.05);
            globalTime += frameDelta;
            stageElapsed += frameDelta;

            if (currentStage === 'JUMP' && stageElapsed >= JUMP_DURATION) {
                setStage('TUNNEL');
            } else if (currentStage === 'EXIT' && stageElapsed >= EXIT_DURATION) {
                setStage('RECOVERY');
            } else if (currentStage === 'RECOVERY' && stageElapsed >= RECOVERY_DURATION) {
                setStage('IDLE');
            }

            updateStageTargets();

            gearPulse = damp(gearPulse, 0.0, 5.5, frameDelta);
            uniformsShip.uHullPulse.value = damp(
                uniformsShip.uHullPulse.value,
                0.0,
                5.5,
                frameDelta
            );
            currentFlash = damp(currentFlash, 0.0, 22.0, frameDelta);
            currentShake = damp(currentShake, target.shake, 12.0, frameDelta);

            currentVisualSpeed = damp(currentVisualSpeed, target.speed, 8.0, frameDelta);
            globalTravelOffset = (
                globalTravelOffset + currentVisualSpeed * frameDelta
            ) % 1024.0;

            const curIntensity = damp(uniformsBack.uIntensity.value, target.intensity, 7.0, frameDelta);
            const curTwist = damp(uniformsBack.uTwist.value, target.twist, 4.0, frameDelta);
            const curBowFocus = damp(uniformsBack.uBowFocus.value, target.bowFocus, 8.0, frameDelta);
            const curEnergyThreshold = damp(
                uniformsBack.uEnergyThreshold.value,
                target.energyThreshold,
                7.0,
                frameDelta
            );
            const curLightning = damp(uniformsBack.uLightning.value, target.lightning, 6.0, frameDelta);

            uniformsPP.uFlash.value = Math.min(
                0.10,
                currentFlash + currentRiftPulse * 0.065
            );
            uniformsPP.uAberration.value = damp(
                uniformsPP.uAberration.value,
                target.aberration,
                10.0,
                frameDelta
            );
            uniformsPP.uRadialBlur.value = damp(
                uniformsPP.uRadialBlur.value,
                target.radialBlur,
                10.0,
                frameDelta
            );

            targetDrift = ((keys.a ? 1.0 : 0.0) - (keys.d ? 1.0 : 0.0)) * 0.32;
            currentDrift = damp(currentDrift, targetDrift, 8.0, frameDelta);
            flowHeading = damp(flowHeading, currentDrift * 0.55, 1.6, frameDelta);
            turnPressure = Math.max(
                -1.0,
                Math.min(1.0, (currentDrift - flowHeading) / 0.18)
            );

            const allTunnelUniforms = [uniformsBack, uniformsFront];
            for (const uniforms of allTunnelUniforms) {
                uniforms.uTime.value = globalTime;
                uniforms.uTravelOffset.value = globalTravelOffset;
                uniforms.uFlowSpeed.value = 0.0;
                uniforms.uRibbonScale.value = target.ribbonScale;
                uniforms.uEnergyThreshold.value = curEnergyThreshold;
                uniforms.uIntensity.value = curIntensity;
                uniforms.uTwist.value = curTwist;
                uniforms.uBowFocus.value = curBowFocus;
                uniforms.uLightning.value = curLightning;
                uniforms.uGear.value = warpGear;
                uniforms.uGearPulse.value = gearPulse;
                uniforms.uTurnPressure.value = turnPressure;
            }

            uniformsSparks.uTime.value = globalTime;
            uniformsSparks.uTravelOffset.value = globalTravelOffset;
            uniformsSparks.uVisualSpeed.value = currentVisualSpeed;
            uniformsSparks.uIntensity.value = curIntensity * 0.72;
            uniformsSparks.uTwist.value = curTwist;
            uniformsSparks.uBowFocus.value = curBowFocus;
            uniformsSparks.uGear.value = warpGear;
            uniformsSparks.uGearPulse.value = gearPulse;
            uniformsSparks.uTurnPressure.value = turnPressure;
            uniformsBlast.uTime.value = globalTime;
            uniformsWake.uTime.value = globalTime;
            uniformsShip.uTime.value = globalTime;

            currentCameraY = damp(currentCameraY, targetCameraY, 5.0, frameDelta);
            const shakeTime = globalTime * 18.0;
            const shakeAmplitude =
                Math.max(currentShake, currentRiftPulse * 0.06) *
                18.0;
            camera.position.set(
                baseCameraX + shakeNoise(shakeTime, 1) * shakeAmplitude,
                currentCameraY + shakeNoise(shakeTime, 2) * shakeAmplitude,
                baseCameraZ + shakeNoise(shakeTime, 3) * shakeAmplitude
            );

            shipContainer.rotation.y = currentDrift;
            tunnelBack.rotation.y = flowHeading;
            tunnelFront.rotation.y = flowHeading;
            sparksMesh.rotation.y = flowHeading;
            foldGroup.rotation.y = flowHeading * 0.25;
            uniformsPP.uCenter.value.set(0.5 - flowHeading * 0.30, 0.5);

            const radialScale = Math.max(1.0, currentCameraY / 2500.0 * 1.12);
            tunnelBack.scale.set(radialScale, radialScale, 1.0);
            tunnelFront.scale.set(radialScale, radialScale, 1.0);
            projectRiftToPostprocess();

            const pressurePercent = Math.round(Math.abs(turnPressure) * 100.0);
            turnValueEl.textContent = pressurePercent + '%';
            turnMeterFill.style.transform = 'scaleX(' + Math.abs(turnPressure).toFixed(3) + ')';
            turnMeterFill.style.transformOrigin = turnPressure >= 0.0 ? 'left center' : 'right center';

            const tunnelVisible = curIntensity > 0.002 || target.intensity > 0.002;
            tunnelBack.visible = tunnelVisible;
            tunnelFront.visible = tunnelVisible;
            sparksMesh.visible = tunnelVisible;

            const blastAge = globalTime - uniformsBlast.uShootTime.value;
            blastMesh.visible = blastAge >= 0.0 && blastAge <= 0.82;
            const wakeAge = globalTime - uniformsWake.uShootTime.value;
            wakeMesh.visible = wakeAge >= 0.0 && wakeAge <= 1.15;

            renderer.setRenderTarget(renderTarget);
            renderer.clear();
            renderer.render(scene, camera);
            
            renderer.setRenderTarget(null);
            renderer.clear();
            renderer.render(orthoScene, orthoCamera);
        }

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderTarget.setSize(width, height);
            uniformsPP.uAspect.value = width / height;
            uniformsPP.uTexelSize.value.set(1 / width, 1 / height);
            uniformsBack.uResolution.value.set(width, height);
            uniformsFront.uResolution.value.set(width, height);
        });

        gearValueEl.textContent = warpGear + ' / 5';
        setStage('IDLE');
        animate();
    </script>
</body>
</html>
