<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-Target Reticle HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --primary-cyan: #4dc3ff;
            --primary-cyan-dim: rgba(77, 195, 255, 0.4);
            --primary-red: #ff4d4d;
            --text-main: #c4dbe0;
            --text-dim: #7a9eab;
            --bg-color: #030811;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #0a1526 0%, var(--bg-color) 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            text-transform: uppercase;
        }

        /* GWIAZDY TŁA */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 140px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 250px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 390px 40px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 430px 280px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.2;
            z-index: 0;
        }

        /* NAGŁÓWEK LEWY GÓRNY */
        .header-top-left {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 10;
        }

        .header-top-left h1 {
            color: var(--primary-cyan);
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--primary-cyan-dim);
            margin-bottom: 5px;
        }

        .header-top-left h2 {
            font-size: 13px;
            color: var(--text-main);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(77, 195, 255, 0.5) 0%, transparent 100%);
            margin-bottom: 15px;
        }

        .header-top-left p {
            font-size: 13px;
            color: var(--text-dim);
            text-transform: none;
            line-height: 1.5;
            max-width: 280px;
        }

        /* ETYKIETA PRAWY GÓRNY */
        .badge-top-right {
            position: absolute;
            top: 40px;
            right: 50px;
            border: 1px solid var(--primary-cyan-dim);
            padding: 8px 30px;
            color: var(--primary-cyan);
            font-size: 16px;
            letter-spacing: 2px;
            clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
            box-shadow: inset 0 0 10px rgba(77, 195, 255, 0.1);
            background: rgba(77, 195, 255, 0.05);
            z-index: 10;
        }

        /* GŁÓWNY KONTENER CELOWNIKA */
        .reticle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            position: relative;
            width: 500px;
            height: 500px;
        }

        .reticle-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 5px var(--primary-cyan-dim));
        }

        .red-glow {
            filter: drop-shadow(0 0 6px rgba(255, 77, 77, 0.8));
        }

        /* DOLNE PANELE INFORMACYJNE */
        .bottom-panels {
            position: absolute;
            bottom: 40px;
            left: 50px;
            right: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .info-box {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 320px;
        }

        .info-icon {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(77, 195, 255, 0.2);
            background: rgba(77, 195, 255, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .info-text h3 {
            color: var(--primary-cyan);
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-text p {
            color: var(--text-dim);
            font-size: 12px;
            text-transform: none;
            line-height: 1.4;
        }

        /* PASEK STATUSU NA ŚRODKU DOŁU */
        .status-center {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 300px;
        }

        .status-svg {
            width: 100%;
            height: 30px;
            margin-bottom: -22px; /* Nakładanie tekstu na środkową linię */
        }

        .status-text {
            color: var(--primary-cyan);
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 600;
            text-shadow: 0 0 8px var(--primary-cyan-dim);
            background: var(--bg-color);
            padding: 0 15px;
        }

    </style>
</head>
<body>

    <div class="stars"></div>

    <header class="header-top-left">
        <h1>SINGLE-TARGET RETICLE</h1>
        <h2>PRECISE &bull; DYNAMIC &bull; LOCKED</h2>
        <div class="divider"></div>
        <p>Compact reticle for acquiring<br>and locking a single target.</p>
    </header>

    <div class="badge-top-right">
        Proposal 1
    </div>

    <main class="reticle-container">
        <svg class="reticle-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

            <!-- === NAWIASY ZEWNĘTRZNE (CYAN) === -->
            <!-- Top-Left -->
            <path d="M 175 130 L 140 130 L 130 140 L 130 175" fill="none" stroke="#4dc3ff" stroke-width="3.5" stroke-linecap="square"/>
            <path d="M 155 118 L 128 118 L 118 128 L 118 155" fill="none" stroke="#4dc3ff" stroke-width="1.5" opacity="0.8"/>
            
            <!-- Top-Right -->
            <path d="M 225 130 L 260 130 L 270 140 L 270 175" fill="none" stroke="#4dc3ff" stroke-width="3.5" stroke-linecap="square"/>
            <path d="M 245 118 L 272 118 L 282 128 L 282 155" fill="none" stroke="#4dc3ff" stroke-width="1.5" opacity="0.8"/>

            <!-- Bottom-Left -->
            <path d="M 175 270 L 140 270 L 130 260 L 130 225" fill="none" stroke="#4dc3ff" stroke-width="3.5" stroke-linecap="square"/>
            <path d="M 155 282 L 128 282 L 118 272 L 118 245" fill="none" stroke="#4dc3ff" stroke-width="1.5" opacity="0.8"/>

            <!-- Bottom-Right -->
            <path d="M 225 270 L 260 270 L 270 260 L 270 225" fill="none" stroke="#4dc3ff" stroke-width="3.5" stroke-linecap="square"/>
            <path d="M 245 282 L 272 282 L 282 272 L 282 245" fill="none" stroke="#4dc3ff" stroke-width="1.5" opacity="0.8"/>


            <!-- === WSKAŹNIKI KIERUNKOWE (CYAN) === -->
            <!-- Top (kropki na zewnątrz) -->
            <path d="M 195 90 L 200 96 L 205 90" fill="none" stroke="#4dc3ff" stroke-width="2.5" stroke-linejoin="miter"/>
            <line x1="200" y1="80" x2="200" y2="30" stroke="#4dc3ff" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.7"/>

            <!-- Bottom (kropki na zewnątrz) -->
            <path d="M 195 310 L 200 304 L 205 310" fill="none" stroke="#4dc3ff" stroke-width="2.5" stroke-linejoin="miter"/>
            <line x1="200" y1="320" x2="200" y2="370" stroke="#4dc3ff" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.7"/>

            <!-- Left -->
            <path d="M 104 195 L 110 200 L 104 205" fill="none" stroke="#4dc3ff" stroke-width="2.5" stroke-linejoin="miter"/>
            <line x1="90" y1="200" x2="40" y2="200" stroke="#4dc3ff" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.7"/>

            <!-- Right -->
            <path d="M 296 195 L 290 200 L 296 205" fill="none" stroke="#4dc3ff" stroke-width="2.5" stroke-linejoin="miter"/>
            <line x1="310" y1="200" x2="360" y2="200" stroke="#4dc3ff" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.7"/>


            <!-- === ŚRODEK (CZERWONY - NAMIERZENIE) === -->
            <g class="red-glow">
                <!-- Solidny diament w centrum -->
                <polygon points="200,195 205,200 200,205 195,200" fill="#ff4d4d" />
                
                <!-- Zewnętrzny zarys diamentu -->
                <polygon points="200,190 210,200 200,210 190,200" fill="none" stroke="#ff4d4d" stroke-width="1.5" />
                
                <!-- 4 małe celowniki / szewrony skierowane do środka -->
                <path d="M 196 182 L 200 178 L 204 182" fill="none" stroke="#ff4d4d" stroke-width="1.5"/>
                <path d="M 196 218 L 200 222 L 204 218" fill="none" stroke="#ff4d4d" stroke-width="1.5"/>
                <path d="M 182 196 L 178 200 L 182 204" fill="none" stroke="#ff4d4d" stroke-width="1.5"/>
                <path d="M 218 196 L 222 200 L 218 204" fill="none" stroke="#ff4d4d" stroke-width="1.5"/>
            </g>

        </svg>
    </main>

    <footer class="bottom-panels">
        <!-- Lewy Panel -->
        <div class="info-box">
            <div class="info-icon">
                <svg width="26" height="26" viewBox="0 0 40 40">
                    <path d="M 12 4 L 4 4 L 4 12 M 4 28 L 4 36 L 12 36 M 28 36 L 36 36 L 36 28 M 36 12 L 36 4 L 28 4" fill="none" stroke="#4dc3ff" stroke-width="2.5"/>
                    <circle cx="20" cy="20" r="3" fill="#4dc3ff"/>
                </svg>
            </div>
            <div class="info-text">
                <h3>LOCK CONFIRMATION</h3>
                <p>Visual indicators confirm<br>target lock and alignment.</p>
            </div>
        </div>

        <!-- Środkowy Panel ze Statusem -->
        <div class="status-center">
            <svg class="status-svg" viewBox="0 0 300 30" xmlns="http://www.w3.org/2000/svg">
                <!-- Lewa strona linii -->
                <path d="M 10 5 L 30 25 L 45 25" fill="none" stroke="#4dc3ff" stroke-width="2" opacity="0.8"/>
                <line x1="50" y1="25" x2="85" y2="25" stroke="#4dc3ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
                
                <!-- Prawa strona linii -->
                <line x1="215" y1="25" x2="250" y2="25" stroke="#4dc3ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
                <path d="M 255 25 L 270 25 L 290 5" fill="none" stroke="#4dc3ff" stroke-width="2" opacity="0.8"/>
            </svg>
            <div class="status-text">STATUS: LOCKED</div>
        </div>

        <!-- Prawy Panel -->
        <div class="info-box" style="flex-direction: row-reverse; text-align: right;">
            <div class="info-icon">
                <svg width="26" height="26" viewBox="0 0 40 40">
                    <path d="M 12 4 L 4 4 L 4 12 M 4 28 L 4 36 L 12 36 M 28 36 L 36 36 L 36 28 M 36 12 L 36 4 L 28 4" fill="none" stroke="#4dc3ff" stroke-width="2.5" stroke-dasharray="4 2"/>
                    <circle cx="20" cy="20" r="3" fill="#4dc3ff"/>
                </svg>
            </div>
            <div class="info-text">
                <h3>DYNAMIC TRACKING</h3>
                <p>Reticle adapts in real-time<br>to target movement.</p>
            </div>
        </div>
    </footer>

</body>
</html>
