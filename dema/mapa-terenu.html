<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa terenu — rzeki i roślinność</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0e; overflow: hidden; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #dfe6e0; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #c:active { cursor: grabbing; }
  #panel { position: fixed; left: 14px; top: 14px; right: 14px; width: fit-content; max-width: calc(100% - 28px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: rgba(8, 14, 12, 0.72);
    border: 1px solid rgba(180, 200, 185, 0.18); border-radius: 8px; backdrop-filter: blur(6px); }
  #panel label { opacity: 0.75; }
  #seed, #panel select { padding: 4px 6px; background: #0f1714; color: inherit; border: 1px solid rgba(180, 200, 185, 0.25); border-radius: 5px; font: inherit; }
  #seed { width: 110px; }
  #roll { padding: 5px 12px; background: #2f6b4f; color: #f2f7f3; border: 0; border-radius: 5px; font: inherit; cursor: pointer; }
  #roll:hover { background: #3a7f5f; }
  #info { position: fixed; left: 14px; bottom: 12px; padding: 4px 8px; background: rgba(8, 14, 12, 0.6); border-radius: 6px; opacity: 0.9; }
  #scale { position: fixed; right: 16px; bottom: 14px; text-align: right; }
  #scale i { display: block; height: 4px; margin-left: auto; background: #dfe6e0; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
  #scale b { font-weight: 500; text-shadow: 0 1px 2px #000; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 12, 11, 0.55); font-size: 15px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"><label for="river">rzeka</label><select id="river"></select><label for="veg">roślinność</label><select id="veg"></select><label for="seed">ziarno</label><input id="seed" inputmode="numeric"><button id="roll" type="button">Losuj miejsce</button></div>
<div id="info"></div>
<div id="scale"><b></b><i></i></div>
<div id="load">Generuję teren…</div>
<script type="module" src="./mapa-terenu.js"></script>
</body>
</html>
