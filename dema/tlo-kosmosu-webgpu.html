<title>Tło kosmosu — generator WebGPU</title>
<!--
  Generator tła kosmosu (WebGPU, three.js r183 z CDN, bez plików gry).

  Tło to nie obrazek, tylko MAPA ŚWIATA: warstwy leżą na różnych głębokościach pod
  płaszczyzną gry, więc paralaksa wynika z perspektywy, a lecąc przez układ widzisz,
  jak tło się zmienia. Regiony przechodzą płynnie (wagi z pozycji kamery w double):
  przy Słońcu, międzyplanetarna, pas asteroid, burza w pasie, zewnętrzny układ, pas
  Kuipera, przestrzeń międzygwiezdna, obłok międzygwiezdny, pustka.

  Warstwy:
    • pył lokalny (2,5 i 12 tys. j.) — strugi wzdłuż orbity przy kamerze, włókienka,
      krawędź od strony Słońca, poświata i smugi przy Słońcu, błyski burzy;
    • mgławica (5 warstw, 70–450 tys. j.) — podwójnie zawinięty przepływ (domain warping,
      zawirowania jak w płynie), włókna z grzbietowego szumu płynące wzdłuż niego,
      barwna obwódka brzegów, ciemny pył, jądra z gwiazdami, które je oświetlają,
      cieniowanie włókien z pochodnych ekranu od strony najjaśniejszej gwiazdy;
    • gwiazdy proceduralne (3 warstwy, barwa z temperatury, krzyże dyfrakcyjne, gromady
      wokół jąder), pas galaktyki z pasmami pyłu, dalekie galaktyki, iskrzenie drobin —
      gwiazdy gasną za pyłem z poczerwienieniem.
  Paleta „auto” zależy od regionu (pas — ognista, Kuiper — lodowa, obłok — magenta
  i cyjan, pustka — błękitna); można ją też wybrać ręcznie.

  Szum to własne funkcje 2D w TSL (setLayout — mały kod, szybka kompilacja).
  Pętle zagnieżdżone mają jawne nazwy liczników, a wszystko, czego używa pętla
  wewnętrzna, jest wyliczone przed nią (.toVar()) — inaczej TSL wbuduje węzły
  w zakres pętli wewnętrznej.

  Uruchomienie: dwuklik (Chrome / Edge z WebGPU, internet dla CDN) albo `npx http-server`
  w katalogu repo i /dema/tlo-kosmosu-webgpu.html (nie przez `npm run dev`).
  Parametry adresu: ?seed=7, ?q=0.5 (jakość 0,35–1), ?webgl=1 (awaryjny WebGL2).
  Eksport PNG: widok 4K albo mgławica bez gwiazd 5120×3200 (jak public/assets/nebula.png gry).
  Konsola: __demo.goto('cloud'), __demo.setSeed(3), __demo.setPalette('fire').
-->

<script type="module">
const errEl = document.getElementById('err');
function showError(text) { errEl.style.display = 'block'; errEl.textContent += `${text}\n`; console.error(text); }
window.addEventListener('error', (e) => showError(`JS: ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => showError(`Promise: ${e.reason?.stack || e.reason}`));

const THREE = await import('three/webgpu');
const {
  Fn, uniform, uniformArray, float, int, vec2, vec3, vec4, Loop, If, Break, dFdx, dFdy,
  positionWorld, cameraPosition, screenCoordinate, screenUV,
  mx_noise_float, mx_fractal_noise_float, mx_cell_noise_float,
  mix, smoothstep, saturate, exp, max, min, abs, dot, normalize, length, fract, floor,
  fwidth, sin, pass
} = await import('three/tsl');
const { bloom } = await import('three/addons/tsl/display/BloomNode.js');

// ---------------------------------------------------------------------------
// Świat demo: Słońce w (0, 0), 1 AU = 100 tys. j. Kamera patrzy z góry jak w grze.

const AU = 100000;
const SUN = { x: 0, y: 0 };
const BELT_R = 2.75 * AU;
const STORM = { x: 2.2 * AU, y: 1.75 * AU, r: 0.45 * AU };
const CLOUD = { x: 85 * AU, y: -22 * AU, r: 28 * AU };
const VOID = { x: 150 * AU, y: 70 * AU };
const PLACES = [
  { id: 'sun', name: 'Przy Słońcu', x: 0.32 * AU, y: 0.08 * AU },
  { id: 'ipm', name: 'Międzyplanetarna', x: 1.25 * AU, y: -0.45 * AU },
  { id: 'belt', name: 'Pas asteroid', x: 2.35 * AU, y: -1.3 * AU },
  { id: 'storm', name: 'Burza w pasie', x: STORM.x, y: STORM.y },
  { id: 'kuiper', name: 'Pas Kuipera', x: 38 * AU, y: -14 * AU },
  { id: 'cloud', name: 'Obłok międzygwiezdny', x: CLOUD.x, y: CLOUD.y },
  { id: 'void', name: 'Pustka', x: VOID.x, y: VOID.y }
];

// Skale szumu (warstwa bliska / daleka); głębokości warstw niżej (NEAR_DEPTHS, FAR_DEPTHS).
const NEAR_SCALE = 1 / 9000;
const FAR_SCALE = 1 / 140000;
const MAX_ILL = 6;
const MAX_FLASH = 4;

// ---------------------------------------------------------------------------
// Renderer

const params = new URLSearchParams(location.search);
const forceWebGL = params.has('webgl') || !('gpu' in navigator);
const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL, powerPreference: 'high-performance' });
renderer.domElement.id = 'gl';
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
// Neutral (Khronos) trzyma nasycenie barw mgławic; ACES wybielał jasne partie.
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);
await renderer.init();
const isWebGPU = renderer.backend.isWebGPUBackend === true;
document.getElementById('backend').textContent = isWebGPU ? 'WebGPU' : 'WebGPU niedostępne — awaryjny WebGL2';

// ---------------------------------------------------------------------------
// Uniformy

const uCamNear = uniform(new THREE.Vector2());   // pozycja kamery × NEAR_SCALE (liczona w double)
const uCamFar = uniform(new THREE.Vector2());    // × FAR_SCALE
const uCamSun = uniform(new THREE.Vector2());    // kamera − Słońce [j.]
const uCamStar = uniform(new THREE.Vector2());   // minimalna paralaksa gwiazd
const uCamGlint = uniform(new THREE.Vector4());  // dwie warstwy iskrzenia
const uSeed = uniform(new THREE.Vector3());
const uTime = uniform(0);
const uNear = uniform(new THREE.Vector4());      // gęstość, jasność, strugi orbitalne, smugi słoneczne
const uNearCol = uniform(new THREE.Vector3(0.8, 0.6, 0.4));
const uSunGlow = uniform(0);
const uFar = uniform(new THREE.Vector4());       // intensywność, ciemny pył, pokrycie, żywość
const uPalA = uniform(new THREE.Vector3());
const uPalB = uniform(new THREE.Vector3());
const uPalC = uniform(new THREE.Vector3());
const uReflect = uniform(new THREE.Vector3(0.35, 0.5, 1.0));
const uStars = uniform(new THREE.Vector4(1, 1, 1, 0)); // jasność, pas galaktyki, galaktyki, krzyże
const uBand = uniform(new THREE.Vector4(1, 0, 0, 0.22)); // normalna xy, przesunięcie, szerokość
const uGlint = uniform(new THREE.Vector4(0, 0, 0, 0));   // siła, rgb
const uLayers = uniform(5);                        // liczba warstw mgławicy (jakość)
const uShadeK = uniform(55);                      // siła cieniowania z pochodnych
const uOrbit = uniform(new THREE.Vector4());      // promień, łuk (przeskalowane), kierunek radialny przy kamerze
const uSunDir2 = uniform(new THREE.Vector2(1, 0)); // kierunek ku Słońcu na ekranie
const illPosArr = Array.from({ length: MAX_ILL }, () => new THREE.Vector4());
const illColArr = Array.from({ length: MAX_ILL }, () => new THREE.Vector4());
const uIllPos = uniformArray(illPosArr, 'vec4');   // względem kamery xyz, promień wpływu
const uIllCol = uniformArray(illColArr, 'vec4');
const uIllCount = uniform(0, 'int');
const flashArr = Array.from({ length: MAX_FLASH }, () => new THREE.Vector4());
const uFlash = uniformArray(flashArr, 'vec4');     // względem kamery xyz, moc
const uFlashCount = uniform(0, 'int');
const uFlashCol = uniform(new THREE.Vector3(0.65, 0.35, 1.0));

// Szum przeplotu (stały): rozmywa schodki bez migotania w czasie.
const ign = Fn(() => fract(float(52.9829189).mul(fract(dot(screenCoordinate.xy, vec2(0.06711056, 0.00583715))))));

// Szum 2D (gradientowy) i fbm jako prawdziwe funkcje shadera (setLayout): mały kod
// i szybka kompilacja. Mgławica to warstwy 2D na różnych głębokościach — drobne
// włókna potrzebują wysokiej częstotliwości, której marsz 3D z kilkudziesięcioma
// próbkami na promień i tak by nie pokazał.
const hash22 = Fn(([p]) => {
  const p3 = fract(vec3(p.x, p.y, p.x).mul(vec3(0.1031, 0.1030, 0.0973))).toVar();
  p3.addAssign(dot(p3, p3.yzx.add(33.33)));
  return fract(vec2(p3.x.add(p3.y), p3.x.add(p3.z)).mul(p3.zy)).mul(2.0).sub(1.0);
}).setLayout({ name: 'hash22', type: 'vec2', inputs: [{ name: 'p', type: 'vec2' }] });

const gnoise = Fn(([p]) => {
  const i = floor(p).toVar();
  const f = fract(p).toVar();
  const u = f.mul(f).mul(f).mul(f.mul(f.mul(6.0).sub(15.0)).add(10.0)).toVar();
  const a = dot(hash22(i), f);
  const b = dot(hash22(i.add(vec2(1.0, 0.0))), f.sub(vec2(1.0, 0.0)));
  const c = dot(hash22(i.add(vec2(0.0, 1.0))), f.sub(vec2(0.0, 1.0)));
  const d = dot(hash22(i.add(vec2(1.0, 1.0))), f.sub(vec2(1.0, 1.0)));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y).mul(1.4);
}).setLayout({ name: 'gnoise', type: 'float', inputs: [{ name: 'p', type: 'vec2' }] });

// fbm z obrotem między oktawami (bez widocznych osi siatki); wynik ~[-1, 1].
const fbm = Fn(([p, oct]) => {
  const sum = float(0).toVar();
  const amp = float(0.5).toVar();
  const q = vec2(p).toVar();
  Loop({ start: 0, end: oct, type: 'int', condition: '<', name: 'o' }, () => {
    sum.addAssign(amp.mul(gnoise(q)));
    q.assign(vec2(q.x.mul(1.6).add(q.y.mul(1.2)), q.y.mul(1.6).sub(q.x.mul(1.2))).add(vec2(1.7, 9.2)));
    amp.mulAssign(0.5);
  });
  return sum;
}).setLayout({ name: 'fbm2', type: 'float', inputs: [{ name: 'p', type: 'vec2' }, { name: 'oct', type: 'int' }] });

// Jedna warstwa mgławicy: podwójnie zawinięty przepływ (zawirowania jak w płynie),
// włókna z grzbietowego szumu płynące wzdłuż niego, barwna obwódka brzegów, ciemny
// pył i cieniowanie z pochodnych ekranu od strony gwiazdy (efekt 3D włókien).
const nebLayer = Fn(([uv, illum, li, ld]) => {
  const o = vec2(li.mul(17.3), li.mul(-11.1));
  const t = uTime.mul(0.01);
  const w = uv.add(o).toVar();
  const q = vec2(fbm(w, int(4)), fbm(w.add(vec2(5.2, 1.3)), int(4))).toVar();
  const r = vec2(
    fbm(w.add(q.mul(3.0)).add(vec2(1.7, 9.2)).add(t), int(4)),
    fbm(w.add(q.mul(3.0)).add(vec2(8.3, 2.8)).sub(t), int(4))
  ).toVar();
  const base = fbm(w.add(r.mul(3.2)), int(5)).mul(0.5).add(0.5).toVar();
  // Maska wielkiej skali wycina puste obszary: mgławica zajmuje część kadru.
  const mask = fbm(w.mul(0.16).add(vec2(3.3, 7.1)), int(3)).mul(0.6).add(0.5).add(uFar.z).toVar();
  const den = smoothstep(0.46, 0.74, base).mul(smoothstep(0.42, 0.72, mask)).toVar();
  const f1 = float(1.0).sub(abs(gnoise(w.mul(6.0).add(r.mul(4.5)))));
  const f2 = float(1.0).sub(abs(gnoise(w.mul(15.0).add(r.mul(8.0)).add(q.mul(3.0)))));
  const f3 = float(1.0).sub(abs(gnoise(w.mul(34.0).add(r.mul(12.0)))));
  const fib = f1.pow(8.0).add(f2.pow(12.0).mul(0.7)).add(f3.pow(16.0).mul(0.45)).toVar();
  // Barwa: dominujące ciało (A, jasność zmienna z przepływem), gorące B przy jądrach
  // i na włóknach, kontrastowa obwódka C na brzegach — bez mieszania barw dopełniających.
  const edge = den.mul(den.oneMinus()).mul(4.0);
  const il = length(illum).toVar();
  const hot = saturate(il.mul(0.55).add(fib.mul(0.1)));
  const body = uPalA.mul(q.x.mul(0.5).add(0.85));
  const colr = mix(mix(body, uPalB, hot), uPalC, edge.mul(0.8));
  const g = vec2(dFdx(base), dFdy(base)).mul(uShadeK);
  const nrm = normalize(vec3(g.negate(), 1.0));
  const lit = saturate(dot(nrm, normalize(vec3(ld, 0.55)))).mul(0.9).add(0.3);
  const glowTouch = den.mul(0.9).add(fib.mul(den).mul(1.4)).add(0.01);
  // Blask jąder w barwie „gorącej” palety (spójny z mgławicą), z domieszką barwy gwiazdy.
  const coreCol = mix(uPalB, illum.div(max(il, 0.0001)), 0.3).mul(il);
  const emis = colr.mul(den).mul(fib.mul(1.35).add(0.06)).mul(lit).mul(uFar.x).add(coreCol.mul(glowTouch));
  const dd = fbm(w.mul(1.7).add(q.mul(2.0)).add(vec2(31.0, 5.0)), int(4)).mul(0.5).add(0.5);
  const dust = smoothstep(0.52, 0.78, dd).mul(uFar.y);
  return vec4(emis, den.mul(0.55).add(dust.mul(2.4)));
}).setLayout({ name: 'nebLayer', type: 'vec4', inputs: [
  { name: 'uv', type: 'vec2' }, { name: 'illum', type: 'vec3' }, { name: 'li', type: 'float' }, { name: 'ld', type: 'vec2' }
] });

// Warstwa pyłu lokalnego (region): przepływ, strugi wzdłuż orbity przy kamerze,
// włókienka, krawędź od strony Słońca, poświata i smugi przy Słońcu.
const nearLayer = Fn(([v, li, ps, fl]) => {
  const sunR = length(ps).toVar();
  const cs = ps.div(max(sunR, 1.0)).toVar();
  const o = vec2(li.mul(13.7), li.mul(4.1));
  const w = uCamNear.add(v.mul(NEAR_SCALE)).add(o).add(uSeed.xy.mul(1.7)).toVar();
  const radial = dot(v, uOrbit.zw);
  const tang = dot(v, vec2(uOrbit.w.negate(), uOrbit.z));
  const ao = vec2(uOrbit.x.add(radial.mul(NEAR_SCALE * 1.8)), uOrbit.y.add(tang.mul(NEAR_SCALE * 0.3))).add(o).toVar();
  const q = vec2(fbm(w, int(3)), fbm(w.add(vec2(5.2, 1.3)), int(3))).toVar();
  const base = fbm(w.add(q.mul(2.5)), int(4)).mul(0.5).add(0.5);
  const streams = fbm(ao.add(q.mul(0.8)), int(4)).mul(0.5).add(0.5);
  const dn = mix(base, streams, uNear.z).toVar();
  const den = smoothstep(0.45, 0.85, dn).mul(uNear.x).toVar();
  const fib = float(1.0).sub(abs(gnoise(w.mul(6.0).add(q.mul(4.0))))).pow(8.0);
  const g = vec2(dFdx(dn), dFdy(dn)).mul(uShadeK);
  const nrm = normalize(vec3(g.negate(), 1.0));
  const lit = saturate(dot(nrm, normalize(vec3(uSunDir2, 0.5)))).mul(0.8).add(0.3);
  const rs = sunR.div(AU * 0.28);
  const glow = uSunGlow.div(rs.mul(rs).add(1.0));
  const strm = smoothstep(-0.2, 0.8, gnoise(vec2(dot(cs, vec2(0.6, 0.8)), dot(cs, vec2(-0.8, 0.6))).mul(9.0).add(sunR.mul(1 / 70000)))).mul(uNear.w).add(0.35);
  const e = uNearCol.mul(den.mul(fib.mul(0.3).add(0.07)).mul(lit).mul(uNear.y).add(glow.mul(den.mul(0.35).add(0.05)).mul(strm)))
    .add(fl.mul(den.add(0.04)));
  return vec4(e, den.mul(0.5));
}).setLayout({ name: 'nearLayer', type: 'vec4', inputs: [
  { name: 'v', type: 'vec2' }, { name: 'li', type: 'float' }, { name: 'ps', type: 'vec2' }, { name: 'fl', type: 'vec3' }
] });

const NEAR_DEPTHS = [2500, 12000];
const FAR_DEPTHS = [70000, 120000, 190000, 290000, 450000];
const FAR_SCALES = [1.0, 0.82, 0.66, 0.54, 0.44];

const skyNebula = Fn(() => {
  const ro = cameraPosition.toVar();
  const rd = normalize(positionWorld.sub(ro)).toVar();
  const invDz = float(1.0).div(max(rd.z.negate(), 0.05)).toVar();
  const s = rd.xy.mul(invDz).toVar();          // punkt na płaszczyźnie „tangensów”
  const col = vec3(0).toVar();
  const T = float(1).toVar();
  // Kierunek na ekranie ku najjaśniejszej gwieździe (do cieniowania włókien).
  const ip0 = uIllPos.element(0);
  const s0 = ip0.xy.sub(ro.xy).div(max(ro.z.sub(ip0.z), 1.0));
  const ld = normalize(s0.sub(s).add(vec2(0.0001, 0.0))).toVar();
  // Pył lokalny
  for (let li = 0; li < NEAR_DEPTHS.length; li++) {
    const p = ro.add(rd.mul(ro.z.add(NEAR_DEPTHS[li]).mul(invDz))).toVar();
    const ps = uCamSun.add(p.xy).toVar();
    const fl = vec3(0).toVar();
    Loop({ start: 0, end: uFlashCount, type: 'int', condition: '<', name: `fk${li}` }, ({ [`fk${li}`]: k }) => {
      const f = uFlash.element(k);
      const d = length(f.xyz.sub(p)).div(9000.0);
      fl.addAssign(uFlashCol.mul(f.w.div(d.mul(d).add(1.0))));
    });
    const L = nearLayer(p.xy, float(li), ps, fl);
    col.addAssign(L.rgb.mul(T).mul(0.7));
    T.mulAssign(exp(L.a.mul(0.7).negate()));
  }
  // Mgławica daleka
  for (let li = 0; li < FAR_DEPTHS.length; li++) {
    If(float(li).lessThan(uLayers).and(T.greaterThan(0.01)), () => {
      const p = ro.add(rd.mul(ro.z.add(FAR_DEPTHS[li]).mul(invDz))).toVar();
      const uv = uCamFar.add(p.xy.mul(FAR_SCALE)).mul(FAR_SCALES[li]).add(uSeed.xy).toVar();
      const illum = vec3(0).toVar();
      Loop({ start: 0, end: uIllCount, type: 'int', condition: '<', name: `ik${li}` }, ({ [`ik${li}`]: k }) => {
        const ip = uIllPos.element(k);
        const d = length(ip.xyz.sub(p)).div(ip.w);
        const fall = d.mul(d).add(1.0);
        illum.addAssign(uIllCol.element(k).xyz.div(fall.mul(fall)));
      });
      const L = nebLayer(uv, illum, float(li), ld);
      const lw = float(1.9).div(uLayers);
      col.addAssign(L.rgb.mul(T).mul(lw));
      T.mulAssign(exp(L.a.mul(lw).negate()));
    });
  }
  return vec4(col, T);
});

// ---------------------------------------------------------------------------
// Gwiazdy (pełna rozdzielczość)

const starTint = Fn(([t]) => {
  const warm = mix(vec3(1.0, 0.58, 0.32), vec3(1.0, 0.88, 0.72), smoothstep(0.0, 0.3, t));
  const white = mix(warm, vec3(0.96, 0.97, 1.0), smoothstep(0.3, 0.65, t));
  return mix(white, vec3(0.62, 0.74, 1.0), smoothstep(0.72, 1.0, t));
});

// Warstwa drobnych gwiazd: jedna gwiazda na komórkę, środek z dala od brzegów.
const starLayer = Fn(([s, K, prob, bright, sd]) => {
  const p = s.mul(K).toVar();
  const cell = floor(p).toVar();
  const f = fract(p).toVar();
  const px = max(fwidth(p.x), 0.0001).toVar();
  const acc = vec3(0).toVar();
  const h0 = mx_cell_noise_float(vec3(cell, sd)).toVar();
  If(h0.lessThan(prob), () => {
    const h1 = mx_cell_noise_float(vec3(cell, sd.add(1.0)));
    const h2 = mx_cell_noise_float(vec3(cell, sd.add(2.0)));
    const h3 = mx_cell_noise_float(vec3(cell, sd.add(3.0)));
    const c = vec2(h1, h2).mul(0.7).add(0.15);
    const d = length(f.sub(c)).div(px);
    const mag = h3.mul(h3).mul(h3).mul(h3);
    const rp = mix(float(0.55), float(1.25), mag);
    const core = exp(d.mul(d).div(rp.mul(rp)).negate());
    acc.assign(starTint(fract(h1.mul(7.13).add(h2.mul(3.7)))).mul(core.mul(mix(float(0.04), float(1.0), mag)).mul(bright)));
  });
  return acc;
});

// Jasne gwiazdy z krzyżami dyfrakcyjnymi (sąsiednie komórki, bo krzyż wystaje poza swoją).
const brightLayer = Fn(([s, K, prob, bright, sd]) => {
  const p = s.mul(K).toVar();
  const base = floor(p).toVar();
  const px = max(fwidth(p.x), 0.0001).toVar();
  const acc = vec3(0).toVar();
  Loop({ start: -1, end: 2, type: 'int', condition: '<', name: 'ox' }, ({ ox }) => {
    Loop({ start: -1, end: 2, type: 'int', condition: '<', name: 'oy' }, ({ oy }) => {
      const cell = base.add(vec2(float(ox), float(oy)));
      const h0 = mx_cell_noise_float(vec3(cell, sd));
      If(h0.lessThan(prob), () => {
        const h1 = mx_cell_noise_float(vec3(cell, sd.add(1.0)));
        const h2 = mx_cell_noise_float(vec3(cell, sd.add(2.0)));
        const h3 = mx_cell_noise_float(vec3(cell, sd.add(3.0)));
        const c = cell.add(vec2(h1, h2).mul(0.6).add(0.2));
        const v = p.sub(c).div(px);   // piksele
        const mag = h3.mul(h3);
        const d2 = dot(v, v);
        const rp = mix(float(0.9), float(2.2), mag);
        const core = exp(d2.div(rp.mul(rp)).negate());
        const halo = exp(d2.sqrt().div(rp.mul(3.5)).negate()).mul(0.12);
        const len = mix(float(4.0), float(24.0), mag.mul(mag));
        const sx = exp(abs(v.y).div(0.55).negate()).mul(exp(abs(v.x).div(len).negate()));
        const sy = exp(abs(v.x).div(0.55).negate()).mul(exp(abs(v.y).div(len).negate()));
        const spikes = sx.add(sy).mul(uStars.w).mul(smoothstep(0.35, 0.9, mag)).mul(0.3);
        acc.addAssign(starTint(fract(h1.mul(5.31).add(h2.mul(9.2)))).mul(core.add(halo).add(spikes)).mul(mix(float(0.25), float(1.0), mag)).mul(bright));
      });
    });
  });
  return acc;
});

const skyStars = Fn(() => {
  const ro = cameraPosition.toVar();
  const rd = normalize(positionWorld.sub(ro)).toVar();
  const s = rd.xy.div(max(rd.z.negate(), 0.05)).toVar();
  const sw = s.add(uCamStar).toVar();
  const col = vec3(0).toVar();
  // Pas galaktyki: poświata z pasmami pyłu.
  const u = dot(sw, uBand.xy).add(mx_noise_float(vec3(sw.mul(1.3), 2.0)).mul(0.07)).sub(uBand.z);
  const band = exp(u.div(uBand.w).mul(u.div(uBand.w)).negate()).mul(uStars.y).toVar();
  const lanes = smoothstep(0.5, 0.78, mx_fractal_noise_float(vec3(sw.mul(7.0), 9.0), 4, 2.0, 0.5).mul(0.5).add(0.5)).mul(band);
  const mottle = mx_fractal_noise_float(vec3(sw.mul(3.0), 4.0), 3, 2.0, 0.5).mul(0.45).add(0.8);
  col.addAssign(vec3(0.085, 0.068, 0.052).mul(band).mul(max(float(1.0).sub(lanes.mul(1.5)), 0.0)).mul(mottle));
  // Gromady: więcej i jaśniejszych gwiazd wokół jąder mgławicy.
  const pxs = max(fwidth(s.x), 0.000001).toVar();
  const cb = float(0).toVar();
  Loop({ start: 0, end: uIllCount, type: 'int', condition: '<', name: 'ck' }, ({ ck }) => {
    const ip = uIllPos.element(ck);
    const si = ip.xy.sub(ro.xy).div(max(ro.z.sub(ip.z), 1.0));
    const v = s.sub(si).div(pxs);
    cb.addAssign(exp(dot(v, v).div(90000.0).negate()).mul(min(length(uIllCol.element(ck).xyz), 2.0)));
  });
  const bandBoost = band.mul(2.2).add(1.0).add(cb.mul(3.0)).toVar();
  col.addAssign(brightLayer(sw, float(26.0), float(0.03).mul(cb.mul(4.0).add(1.0)), float(1.6).mul(cb.mul(0.6).add(1.0)), float(1.0)));
  col.addAssign(starLayer(sw, float(70.0), float(0.12).mul(bandBoost), float(0.7), float(11.0)));
  col.addAssign(starLayer(sw, float(160.0), float(0.12).mul(bandBoost), float(0.28), float(21.0)));
  // Dalekie galaktyki (głównie w pustce).
  const gp = sw.mul(9.0).toVar();
  const gcell = floor(gp);
  const gh = mx_cell_noise_float(vec3(gcell, 41.0));
  If(gh.lessThan(uStars.z.mul(0.28)), () => {
    const a1 = mx_cell_noise_float(vec3(gcell, 42.0));
    const a2 = mx_cell_noise_float(vec3(gcell, 43.0));
    const ang = a1.mul(6.2832);
    const v = fract(gp).sub(vec2(a1, a2).mul(0.5).add(0.25));
    const ca = sin(ang.add(1.5708)), sa = sin(ang);
    const x = v.x.mul(ca).add(v.y.mul(sa));
    const y = v.y.mul(ca).sub(v.x.mul(sa));
    const e = x.mul(x).mul(900.0).add(y.mul(y).mul(mix(float(2500.0), float(9000.0), a2)));
    col.addAssign(vec3(0.9, 0.82, 0.7).mul(exp(e.negate()).mul(0.5).add(exp(e.mul(8.0).negate()).mul(1.4))).mul(0.25));
  });
  // Iskrzenie drobin (pas asteroid, pas Kuipera) — dwie bliskie warstwy z paralaksą.
  If(uGlint.x.greaterThan(0.001), () => {
    const invDz = float(1.0).div(max(rd.z.negate(), 0.05));
    const g1 = uCamGlint.xy.add(ro.xy.add(rd.xy.mul(ro.z.add(2500.0).mul(invDz))).mul(1 / 140));
    const g2 = uCamGlint.zw.add(ro.xy.add(rd.xy.mul(ro.z.add(9000.0).mul(invDz))).mul(1 / 380));
    const tw = Fn(([g, sd]) => {
      const cell = floor(g);
      const h = mx_cell_noise_float(vec3(cell, sd));
      const c = vec2(mx_cell_noise_float(vec3(cell, sd.add(1.0))), mx_cell_noise_float(vec3(cell, sd.add(2.0))));
      const pxg = max(fwidth(g.x), 0.0001);
      const d = length(fract(g).sub(c)).div(pxg);
      const phase = sin(uTime.mul(mix(float(2.0), float(7.0), h)).add(h.mul(40.0))).mul(0.5).add(0.5);
      return smoothstep(0.92, 1.0, h).mul(exp(d.mul(d).mul(-0.7))).mul(phase.mul(phase).mul(phase));
    });
    const gl = tw(g1, float(51.0)).mul(1.4).add(tw(g2, float(61.0)).mul(0.7));
    col.addAssign(uGlint.yzw.mul(gl).mul(uGlint.x));
  });
  // Gwiazdy wewnątrz mgławicy: jasne jądro, halo i krzyż.
  Loop({ start: 0, end: uIllCount, type: 'int', condition: '<', name: 'sk' }, ({ sk }) => {
    const k = sk;
    const ip = uIllPos.element(k);
    const id = normalize(ip.xyz.sub(ro));
    const si = id.xy.div(max(id.z.negate(), 0.05));
    const v = s.sub(si).div(pxs);
    const d2 = dot(v, v);
    const lum = length(uIllCol.element(k).xyz);
    const tint = uIllCol.element(k).xyz.div(max(lum, 0.0001));
    const core = exp(d2.div(6.0).negate()).mul(9.0);
    const halo = exp(d2.sqrt().div(26.0).negate()).mul(0.5).add(exp(d2.sqrt().div(110.0).negate()).mul(0.08));
    const len = float(38.0);
    const sx = exp(abs(v.y).div(0.8).negate()).mul(exp(abs(v.x).div(len).negate()));
    const sy = exp(abs(v.x).div(0.8).negate()).mul(exp(abs(v.y).div(len).negate()));
    col.addAssign(tint.mul(core.add(halo).add(sx.add(sy).mul(uStars.w).mul(0.35))).mul(min(lum, 2.5)));
  });
  return vec4(col.mul(uStars.x), 1.0);
});

const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function regionWeights(x, y) {
  const r = Math.hypot(x - SUN.x, y - SUN.y) / AU;
  const w = {};
  w.sun = 1 - sstep(0.4, 0.95, r);
  w.belt = sstep(1.95, 2.3, r) * (1 - sstep(3.2, 3.65, r));
  w.storm = (1 - sstep(STORM.r * 0.45, STORM.r, Math.hypot(x - STORM.x, y - STORM.y))) * w.belt;
  w.belt -= w.storm;
  w.kuiper = sstep(27, 32, r) * (1 - sstep(50, 58, r));
  w.cloud = 1 - sstep(CLOUD.r * 0.5, CLOUD.r, Math.hypot(x - CLOUD.x, y - CLOUD.y));
  w.inter = sstep(55, 72, r) * (1 - w.cloud);
  w.void = sstep(105, 135, r) * (1 - w.cloud);
  w.inter *= 1 - w.void;
  w.ipm = (1 - sstep(3.6, 7, r)) * (1 - w.sun) * (1 - w.belt - w.storm);
  w.outer = sstep(3.6, 7, r) * (1 - w.kuiper) * (1 - sstep(55, 72, r));
  let sum = 0;
  for (const k in w) { w[k] = Math.max(0, w[k]); sum += w[k]; }
  for (const k in w) w[k] /= sum || 1;
  return { w, r };
}

function rand(seed, a, b, c = 0) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177) ^ Math.imul(seed | 0, 1911520717);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function applySeed() {
  const s = S.seed;
  uSeed.value.set(rand(s, 1, 2) * 97, rand(s, 3, 4) * 97, rand(s, 5, 6) * 7);
  const a = rand(s, 7, 8) * Math.PI;
  uBand.value.set(Math.cos(a), Math.sin(a), (rand(s, 9, 10) - 0.5) * 0.5, 0.2 + rand(s, 11, 12) * 0.12);
  document.getElementById('seed').value = String(s);
}

const ILL_G = 450000;
const _ills = [];
function updateIlluminators() {
  _ills.length = 0;
  const cx = Math.floor(S.x / ILL_G), cy = Math.floor(S.y / ILL_G);
  for (let gx = cx - 2; gx <= cx + 2; gx++) {
    for (let gy = cy - 2; gy <= cy + 2; gy++) {
      if (rand(S.seed, gx, gy, 1) > 0.62) continue;
      const x = (gx + 0.15 + rand(S.seed, gx, gy, 2) * 0.7) * ILL_G;
      const y = (gy + 0.15 + rand(S.seed, gx, gy, 3) * 0.7) * ILL_G;
      const z = -(170000 + rand(S.seed, gx, gy, 4) * 250000);
      const hot = rand(S.seed, gx, gy, 5);
      const lum = 0.6 + Math.pow(rand(S.seed, gx, gy, 6), 2) * 2.2;
      const dx = x - S.x, dy = y - S.y;
      const dist = Math.hypot(dx, dy);
      const fade = 1 - sstep(700000, 1000000, dist);
      if (fade <= 0) continue;
      const tint = hot > 0.35 ? [0.62, 0.78, 1.0] : (hot > 0.12 ? [1.0, 0.95, 0.88] : [1.0, 0.62, 0.38]);
      _ills.push({ dx, dy, z, r: 60000 + lum * 30000, lum: lum * fade, tint, w: lum * fade / (1 + (dist / 400000) ** 2) });
    }
  }
  _ills.sort((a, b) => b.w - a.w);
  const n = Math.min(MAX_ILL, _ills.length);
  const k = S.gainsFarForIll ?? 1;
  for (let i = 0; i < n; i++) {
    const it = _ills[i];
    illPosArr[i].set(it.dx, it.dy, it.z, it.r);
    illColArr[i].set(it.tint[0] * it.lum * k * 0.7, it.tint[1] * it.lum * k * 0.7, it.tint[2] * it.lum * k * 0.7, 0);
  }
  uIllCount.value = n;
}

// ---------------------------------------------------------------------------
// Aktualizacja parametrów z regionu

const _blend = {};
function updateRegion(dt) {
  const { w, r } = regionWeights(S.x, S.y);
  for (const key of ['nd', 'nb', 'stream', 'strm', 'glow', 'fi', 'fd', 'cov', 'stars', 'band', 'gal', 'glint']) _blend[key] = 0;
  const col = [0, 0, 0], gcol = [0, 0, 0];
  let best = 'ipm', bestW = -1;
  for (const k in w) {
    const p = PRESETS[k], wk = w[k];
    if (!wk) continue;
    for (const key in _blend) _blend[key] += p[key] * wk;
    for (let i = 0; i < 3; i++) { col[i] += p.col[i] * wk; gcol[i] += p.gcol[i] * wk; }
    if (wk > bestW) { bestW = wk; best = k; }
  }
  applyPalette(w);
  const g = S.gains;
  uNear.value.set(_blend.nd * g.near, _blend.nb, _blend.stream, _blend.strm);
  uNearCol.value.set(col[0], col[1], col[2]);
  uSunGlow.value = _blend.glow * g.near;
  uFar.value.set(_blend.fi * g.neb, _blend.fd * g.dust, _blend.cov + g.cov, 0);
  S.gainsFarForIll = Math.min(2.5, _blend.fi) * g.neb;
  uStars.value.x = (S.hideStars ? 0 : _blend.stars * g.stars);
  uStars.value.y = document.getElementById('c-band').checked ? _blend.band : 0;
  uStars.value.z = _blend.gal;
  uStars.value.w = document.getElementById('c-spikes').checked ? 1 : 0;
  uGlint.value.set(_blend.glint * g.near, gcol[0], gcol[1], gcol[2]);
  S.stormW = w.storm;
  const name = REGION_NAMES[best];
  if (name !== S.lastRegion) {
    S.lastRegion = name;
    for (const b of document.querySelectorAll('#places button')) b.classList.toggle('on', b.dataset.id === best);
  }
  document.getElementById('region').textContent = `${name} · ${r < 10 ? r.toFixed(2) : r.toFixed(0)} AU od Słońca`;
}

function updateStorm(dt) {
  S.flashCd -= dt;
  if (S.stormW > 0.05 && S.flashCd <= 0) {
    const half = S.H * 0.35 * camera.aspect;
    S.flashes.push({ x: (Math.random() - 0.5) * half * 2.4, y: (Math.random() - 0.5) * S.H * 0.8, z: -(4000 + Math.random() * 22000), age: 0, life: 0.18 + Math.random() * 0.3, p: 2 + Math.random() * 4 });
    if (S.flashes.length > MAX_FLASH) S.flashes.shift();
    S.flashCd = 0.12 + Math.random() * (1.2 - S.stormW);
  }
  let n = 0;
  for (let i = S.flashes.length - 1; i >= 0; i--) {
    const f = S.flashes[i];
    f.age += dt;
    if (f.age > f.life) { S.flashes.splice(i, 1); continue; }
  }
  for (const f of S.flashes) {
    const k = (1 - f.age / f.life) * (0.6 + 0.4 * Math.sin(f.age * 90) * Math.sin(f.age * 37 + f.p));
    flashArr[n++].set(f.x, f.y, f.z, f.p * Math.max(0, k) * S.stormW * S.gains.near);
  }
  uFlashCount.value = n;
}

function fitCamera() {
  camera.position.set(0, 0, S.H);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();
  const half = S.H * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.35;
  for (const m of [nebMesh, starMesh]) { m.scale.set(half * 2 * camera.aspect, half * 2, 1); m.position.set(0, 0, -1); }
}

function setCameraUniforms() {
  // Wszystko w układzie kamery (render przy 0,0), pozycja świata w double tylko tu.
  const dx = S.x - SUN.x, dy = S.y - SUN.y;
  const r = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);
  if (S.thetaPrev === undefined) S.theta = ang;
  else { let d = ang - S.thetaPrev; d -= Math.round(d / (Math.PI * 2)) * Math.PI * 2; S.theta += d; }
  S.thetaPrev = ang;
  uOrbit.value.set(r * NEAR_SCALE * 1.8, S.theta * r * NEAR_SCALE * 0.3, dx / r, dy / r);
  uSunDir2.value.set(-dx / r, -dy / r);
  const bufH = renderer.domElement.height || innerHeight;
  uShadeK.value = 60 * (bufH * nebPass.getResolutionScale()) / 1000;
  uCamNear.value.set(S.x * NEAR_SCALE, S.y * NEAR_SCALE);
  uCamFar.value.set(S.x * FAR_SCALE, S.y * FAR_SCALE);
  uCamSun.value.set(S.x - SUN.x, S.y - SUN.y);
  uCamStar.value.set(S.x * 2e-8, S.y * 2e-8);
  uCamGlint.value.set((S.x / 140) % 100000, (S.y / 140) % 100000, (S.x / 380) % 100000, (S.y / 380) % 100000);
}

// ---------------------------------------------------------------------------
// Mapa (skala logarytmiczna od Słońca)

const mapEl = document.getElementById('map');
const mctx = mapEl.getContext('2d');
const MW = mapEl.width, MH = mapEl.height;
const mapR = (rAu) => Math.log10(1 + rAu * 3) / Math.log10(1 + 200 * 3) * (MW * 0.47);
function toMap(x, y) {
  const rAu = Math.hypot(x, y) / AU;
  const a = Math.atan2(y, x);
  const rm = mapR(rAu);
  return [MW * 0.5 + Math.cos(a) * rm, MH * 0.5 - Math.sin(a) * rm * 0.5];
}
function fromMap(mx, my) {
  const dx = mx - MW * 0.5, dy = -(my - MH * 0.5) * 2;
  const rm = Math.hypot(dx, dy);
  const rAu = (Math.pow(10, rm / (MW * 0.47) * Math.log10(1 + 200 * 3)) - 1) / 3;
  const a = Math.atan2(dy, dx);
  return [Math.cos(a) * rAu * AU, Math.sin(a) * rAu * AU];
}
function drawMap() {
  mctx.clearRect(0, 0, MW, MH);
  const ring = (r0, r1, color) => {
    mctx.fillStyle = color;
    mctx.beginPath();
    mctx.ellipse(MW / 2, MH / 2, mapR(r1), mapR(r1) * 0.5, 0, 0, Math.PI * 2);
    mctx.ellipse(MW / 2, MH / 2, mapR(r0), mapR(r0) * 0.5, 0, 0, Math.PI * 2, true);
    mctx.fill('evenodd');
  };
  ring(2.2, 3.3, 'rgba(210,160,100,.35)');
  ring(30, 50, 'rgba(130,180,255,.25)');
  const [cx, cy] = toMap(CLOUD.x, CLOUD.y);
  const g = mctx.createRadialGradient(cx, cy, 2, cx, cy, 34);
  g.addColorStop(0, 'rgba(255,90,160,.55)'); g.addColorStop(1, 'rgba(255,90,160,0)');
  mctx.fillStyle = g; mctx.beginPath(); mctx.arc(cx, cy, 34, 0, Math.PI * 2); mctx.fill();
  const [sx, sy] = toMap(STORM.x, STORM.y);
  mctx.fillStyle = 'rgba(190,120,255,.7)'; mctx.beginPath(); mctx.arc(sx, sy, 4, 0, Math.PI * 2); mctx.fill();
  mctx.fillStyle = '#ffd27a'; mctx.beginPath(); mctx.arc(MW / 2, MH / 2, 6, 0, Math.PI * 2); mctx.fill();
  mctx.font = '18px system-ui'; mctx.fillStyle = 'rgba(200,215,240,.55)';
  mctx.fillText('pas', ...toMap(2.9 * AU, -1.6 * AU));
  mctx.fillText('Kuiper', ...toMap(40 * AU, -30 * AU));
  mctx.fillText('obłok', cx + 18, cy - 10);
  const [px, py] = toMap(S.x, S.y);
  mctx.strokeStyle = '#7fffb0'; mctx.lineWidth = 3;
  mctx.beginPath(); mctx.arc(px, py, 7, 0, Math.PI * 2); mctx.stroke();
}
mapEl.addEventListener('click', (e) => {
  const rect = mapEl.getBoundingClientRect();
  const [x, y] = fromMap((e.clientX - rect.left) * (MW / rect.width), (e.clientY - rect.top) * (MH / rect.height));
  travelTo(x, y);
});

// ---------------------------------------------------------------------------
// Podróż i sterowanie

function travelTo(x, y, H) {
  const dist = Math.hypot(x - S.x, y - S.y);
  S.travel = { x0: S.x, y0: S.y, x1: x, y1: y, t: 0, dur: 2.2 + Math.log10(1 + dist / AU) * 1.6, H0: S.H, H1: H || S.tH };
}
const placesEl = document.getElementById('places');
for (const p of PLACES) {
  const b = document.createElement('button');
  b.textContent = p.name;
  b.dataset.id = p.id;
  b.addEventListener('click', () => travelTo(p.x, p.y));
  placesEl.appendChild(b);
}

const $ = (id) => document.getElementById(id);
function bindRange(id, out, fn) {
  const el = $(id), o = $(out);
  const upd = () => { const v = Number(el.value); o.textContent = v.toFixed(2); fn(v); };
  el.addEventListener('input', upd);
  upd();
}
bindRange('s-neb', 'o-neb', (v) => { S.gains.neb = v; });
bindRange('s-cov', 'o-cov', (v) => { S.gains.cov = v; });
bindRange('s-dust', 'o-dust', (v) => { S.gains.dust = v; });
bindRange('s-near', 'o-near', (v) => { S.gains.near = v; });
bindRange('s-stars', 'o-stars', (v) => { S.gains.stars = v; });
bindRange('s-bloom', 'o-bloom', (v) => { bloomNode.strength.value = v; });
bindRange('s-sat', 'o-sat', (v) => { uSat.value = v; });
bindRange('s-q', 'o-q', (v) => {
  nebPass.setResolutionScale(v);
  uLayers.value = v < 0.55 ? 3 : (v < 0.8 ? 4 : 5);
});
if (params.has('q') || !isWebGPU) { $('s-q').value = params.get('q') || '0.5'; $('s-q').dispatchEvent(new Event('input')); }
$('c-anim').addEventListener('change', (e) => { S.anim = e.target.checked; });
$('pal').addEventListener('change', (e) => setPalette(e.target.value));
$('seed').addEventListener('change', (e) => { S.seed = Math.max(1, Number(e.target.value) || 1); applySeed(); });
$('rnd').addEventListener('click', () => { S.seed = 1 + Math.floor(Math.random() * 99998); applySeed(); });
function setPalette(id) {
  S.pal = PALETTES[id] ? id : 'auto';
  $('pal').value = S.pal;
}
function applyPalette(w) {
  const a = [0, 0, 0], b = [0, 0, 0], c = [0, 0, 0], rf = [0, 0, 0];
  const add = (p, k) => { for (let i = 0; i < 3; i++) { a[i] += p.a[i] * k; b[i] += p.b[i] * k; c[i] += p.c[i] * k; rf[i] += p.refl[i] * k; } };
  if (S.pal !== 'auto') add(PALETTES[S.pal], 1);
  else for (const k in w) if (w[k]) add(PALETTES[PRESETS[k].pal], w[k]);
  uPalA.value.set(...a); uPalB.value.set(...b); uPalC.value.set(...c); uReflect.value.set(...rf);
}

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  S.keys.add(k);
  if (k === 'h') $('panel').classList.toggle('hidden');
});
addEventListener('keyup', (e) => S.keys.delete(e.key.toLowerCase()));
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  S.tH = Math.min(60000, Math.max(3000, S.tH * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });
addEventListener('resize', () => {
  if (S.exporting) return;
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// ---------------------------------------------------------------------------
// Eksport PNG (render do celu, odczyt, zapis)

const toastEl = $('toast');
function toast(text, ms = 2500) {
  toastEl.textContent = text; toastEl.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { toastEl.style.display = 'none'; }, ms);
}
async function exportPNG(w, h, withStars, name) {
  if (S.exporting) return;
  S.exporting = true;
  toast(`Renderuję ${w}×${h}…`, 60000);
  const prevPR = renderer.getPixelRatio();
  const prevAspect = camera.aspect;
  const prevQ = nebPass.getResolutionScale();
  try {
    S.hideStars = !withStars;
    updateRegion(0);
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    fitCamera();
    nebPass.setResolutionScale(1);
    const rt = new THREE.RenderTarget(w, h, { type: THREE.UnsignedByteType, depthBuffer: false });
    // Bez colorSpace=SRGB: shader potoku już koduje sRGB (outputColorTransform),
    // format sRGB zakodowałby drugi raz (rozjaśniony, sprany PNG).
    renderer.setOutputRenderTarget(rt);
    pipeline.render();
    renderer.setOutputRenderTarget(null);
    const px = await renderer.readRenderTargetPixelsAsync(rt, 0, 0, w, h);
    rt.dispose();
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c2 = cv.getContext('2d');
    const img = c2.createImageData(w, h);
    const flip = !isWebGPU;   // WebGL czyta od dołu
    // WebGPU zwraca wiersze wyrównane do 256 B (copyTextureToBuffer).
    const stride = isWebGPU ? Math.ceil(w * 4 / 256) * 256 : w * 4;
    for (let y = 0; y < h; y++) {
      const src = (flip ? h - 1 - y : y) * stride;
      img.data.set(px.subarray(src, src + w * 4), y * w * 4);
    }
    for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
    c2.putImageData(img, 0, 0);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`Zapisano ${name}`);
  } catch (err) {
    showError(`Eksport: ${err.stack || err}`);
  } finally {
    S.hideStars = false;
    nebPass.setResolutionScale(prevQ);
    renderer.setPixelRatio(prevPR);
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = prevAspect;
    camera.updateProjectionMatrix();
    S.exporting = false;
  }
}
$('e-4k').addEventListener('click', () => exportPNG(3840, 2160, true, `tlo-${S.seed}-${Date.now() % 100000}.png`));
$('e-neb').addEventListener('click', () => exportPNG(5120, 3200, false, `nebula-${S.seed}.png`));

// ---------------------------------------------------------------------------
// Pętla

applySeed();
setPalette('auto');
let last = performance.now();
let fpsAcc = 0, fpsN = 0;
function frame(now) {
  if (S.exporting) return;
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
  last = now;
  if (S.anim) S.time += dt;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { S.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }

  if (S.travel) {
    const tr = S.travel;
    tr.t += dt / tr.dur;
    const k = tr.t >= 1 ? 1 : (tr.t < 0.5 ? 4 * tr.t ** 3 : 1 - (-2 * tr.t + 2) ** 3 / 2);
    S.x = tr.x0 + (tr.x1 - tr.x0) * k;
    S.y = tr.y0 + (tr.y1 - tr.y0) * k;
    if (tr.t >= 1) S.travel = null;
  } else {
    const speed = S.H * 1.6 * (S.keys.has('shift') ? 8 : 1) * dt;
    if (S.keys.has('w') || S.keys.has('arrowup')) S.y += speed;
    if (S.keys.has('s') || S.keys.has('arrowdown')) S.y -= speed;
    if (S.keys.has('a') || S.keys.has('arrowleft')) S.x -= speed;
    if (S.keys.has('d') || S.keys.has('arrowright')) S.x += speed;
  }
  S.H += (S.tH - S.H) * Math.min(1, dt * 6);

  uTime.value = S.time;
  fitCamera();
  setCameraUniforms();
  updateRegion(dt);
  updateIlluminators();
  updateStorm(dt);
  pipeline.render();

  drawMap();
  $('stats').textContent = `FPS ${S.fps.toFixed(0)} · mgławica ${Math.round(nebPass.getResolutionScale() * 100)}% · warstw ${uLayers.value}`;
}
renderer.setAnimationLoop(frame);

window.__demo = {
  S, travelTo, exportPNG, setPalette,
  goto: (id) => { const p = PLACES.find((q) => q.id === id); if (p) { S.travel = null; S.x = p.x; S.y = p.y; } },
  setSeed: (s) => { S.seed = s; applySeed(); },
  frame
};
</script>
</body>
</html>
