<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyposażenie — makieta</title>
<style>
  :root {
    --bg: #020305;
    --frame-a: #232323;
    --frame-b: #0a0a0a;
    --screen: #050608;
    --line: rgba(255, 255, 255, 0.08);
    --line-2: rgba(255, 255, 255, 0.16);
    --text: #d9dee5;
    --muted: #7d8692;
    --dim: #4b525c;
    --orange: #ff6600;
    --amber: #ffaa33;
    --blue: #3ea6ff;
    --red: #ff4545;
    --green: #47d18c;
    --violet: #b18cff;
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
    --fs-xs: 11px;
    --fs-s: 12px;
    --fs-m: 13px;
    --fs-l: 16px;
    --fs-xl: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); }
  body {
    background:
      radial-gradient(1200px 700px at 70% 40%, rgba(40, 70, 120, 0.18), transparent 70%),
      radial-gradient(2px 2px at 12% 30%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 82% 64%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(1.5px 1.5px at 45% 88%, rgba(255,255,255,.25), transparent 60%),
      var(--bg);
    overflow: hidden;
  }
  button { font-family: var(--mono); }

  /* ---------- przełącznik makiety (poza tabletem) ---------- */
  .mock-bar {
    position: fixed; top: 6px; right: 12px; z-index: 50; display: flex; gap: 6px; align-items: center;
    font-size: var(--fs-xs); color: var(--muted); letter-spacing: .04em;
  }
  .mock-bar button {
    background: transparent; color: var(--muted); border: 1px solid var(--line-2); padding: 3px 8px; cursor: pointer; font-size: var(--fs-xs);
  }
  .mock-bar button.on { color: var(--text); border-color: var(--orange); }

  /* ---------- tablet stacji ---------- */
  .tablet {
    position: absolute; inset: 16px; margin: auto; width: min(1700px, calc(100vw - 32px)); height: min(1040px, calc(100vh - 32px));
    background: linear-gradient(180deg, var(--frame-a), var(--frame-b)); border: 1px solid #2c2c2c; border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65); display: flex; flex-direction: column; padding: 14px 12px 8px;
  }
  .t-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 2px 6px 10px; }
  .t-head .crumb { font-size: var(--fs-xs); color: var(--muted); letter-spacing: .12em; }
  .t-head .station { font-size: var(--fs-l); font-weight: 700; letter-spacing: .06em; margin-top: 4px; }
  .t-head .link { font-size: var(--fs-xs); color: var(--orange); letter-spacing: .08em; margin-top: 3px; }
  .t-head .right { display: flex; gap: 8px; }
  .pill { font-size: var(--fs-xs); border: 1px solid var(--line-2); padding: 5px 9px; color: var(--text); background: rgba(0,0,0,.35); letter-spacing: .06em; }
  .pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  .pill.close { border-color: #6b1d1d; cursor: pointer; }
  .tabs { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.35); border: 1px solid var(--line); height: 38px; padding: 0 6px; }
  .tabs .arrow { width: 30px; height: 28px; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--muted); font-size: var(--fs-s); }
  .tabs .list { flex: 1; display: flex; justify-content: center; gap: 46px; font-size: var(--fs-s); letter-spacing: .14em; color: var(--dim); }
  .tabs .list span.active { color: #fff; font-weight: 700; font-size: var(--fs-m); position: relative; }
  .tabs .list span.active::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -9px; height: 3px; background: var(--red); border-radius: 2px; }
  .screen { flex: 1; min-height: 0; margin-top: 8px; background: var(--screen); border: 1px solid var(--line); position: relative; display: flex; flex-direction: column; }
  .t-foot { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); padding: 7px 6px 0; letter-spacing: .08em; }
  .t-foot b { color: var(--text); }

  /* ---------- pasek stanu okrętu ---------- */
  .status {
    display: flex; align-items: center; gap: 18px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .status .ship { font-size: var(--fs-l); font-weight: 700; letter-spacing: .08em; }
  .status .cfg { font-size: var(--fs-s); color: var(--amber); letter-spacing: .08em; border: 1px solid rgba(255,170,51,.35); padding: 3px 8px; }
  .status .kv { font-size: var(--fs-s); color: var(--muted); letter-spacing: .06em; }
  .status .kv b { color: var(--text); font-weight: 600; }
  .status .grow { flex: 1; }
  .btn {
    background: transparent; color: var(--text); border: 1px solid var(--line-2); padding: 7px 12px; font-size: var(--fs-s); letter-spacing: .08em;
    cursor: pointer; position: relative;
  }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { color: var(--dim); border-color: var(--line); cursor: default; }
  .btn.primary { border-color: var(--orange); color: #fff; }
  .btn.primary::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--orange); }
  .btn.primary:disabled { color: var(--dim); border-color: var(--line-2); cursor: default; }
  .btn.primary:disabled::after { background: var(--dim); }

  /* ---------- widok KONFIGURACJE ---------- */
  .view { flex: 1; min-height: 0; display: none; }
  .view.on { display: flex; flex-direction: column; }
  .cards {
    flex: 1; min-height: 0; display: grid; gap: 12px; padding: 14px 18px 10px;
    grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(170px, 0.62fr);
  }
  .card {
    --acc: var(--orange);
    border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0));
    display: flex; flex-direction: column; padding: 14px 14px 12px; cursor: pointer; position: relative; min-width: 0;
    transition: border-color .15s, opacity .15s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--acc); opacity: .55; }
  .card:hover { border-color: var(--line-2); }
  .card.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset, 0 0 26px rgba(255, 102, 0, .08); }
  .cards.has-sel .card:not(.sel):not(.refit) { opacity: .62; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-name { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .08em; color: #fff; }
  .card-tag { font-size: var(--fs-xs); letter-spacing: .1em; color: var(--green); border: 1px solid rgba(71,209,140,.4); padding: 2px 6px; }
  .card-tag.later { color: var(--amber); border-color: rgba(255,170,51,.4); }
  .card-role { font-size: var(--fs-s); color: var(--muted); margin-top: 5px; letter-spacing: .03em; min-height: 32px; line-height: 1.35; }
  .profile-wrap { margin-top: 10px; }
  .profile { display: block; width: 100%; height: 96px; }
  .axis { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--dim); margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: var(--fs-xs); letter-spacing: .06em; border: 1px solid var(--line-2); padding: 3px 7px; color: var(--text); }
  .chip i { font-style: normal; color: var(--muted); margin-right: 5px; }
  .stats { margin-top: 12px; display: grid; gap: 6px; }
  .stat { display: grid; grid-template-columns: 1fr auto 62px; gap: 8px; align-items: baseline; font-size: var(--fs-s); }
  .stat .k { color: var(--muted); letter-spacing: .05em; }
  .stat .v { color: #fff; font-weight: 600; }
  .stat .d { text-align: right; font-size: var(--fs-xs); white-space: nowrap; }
  .d.up { color: var(--green); } .d.down { color: var(--red); } .d.same { color: var(--dim); }
  .loadout { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: var(--fs-s); min-height: 0; overflow: hidden; align-content: start; }
  .fitmap { flex: 1; min-height: 70px; position: relative; margin-top: 8px; }
  .fitmap canvas { position: absolute; inset: 0 0 16px; width: 100%; height: calc(100% - 16px); display: block; }
  .fitmap-k { position: absolute; left: 0; bottom: 0; font-size: var(--fs-xs); color: var(--muted); letter-spacing: .05em; }
  .loadout li { display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }
  .loadout li b { color: #fff; min-width: 30px; text-align: right; font-weight: 600; }
  .loadout li span { overflow: hidden; text-overflow: ellipsis; }
  .loadout li i { font-style: normal; color: var(--muted); margin-left: auto; padding-left: 6px; }
  .loadout li.sub span { color: var(--amber); }
  .loadout li.empty span { color: var(--red); }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .avail { font-size: var(--fs-xs); letter-spacing: .05em; color: var(--muted); line-height: 1.5; }
  .avail b { color: var(--text); }
  .avail .warn { color: var(--red); font-size: var(--fs-s); }
  .avail .price { color: #fff; font-size: var(--fs-s); font-weight: 600; }
  .card-foot .btns { display: flex; gap: 6px; margin-left: auto; }
  .card-foot .btn { padding: 7px 10px; }
  .loadout li.buy span { color: #fff; }
  .loadout li.buy b::before { content: "+"; color: var(--amber); margin-right: 1px; }
  .fitmap-k .buy-k { color: #fff; font-size: 9px; vertical-align: 1px; }
  .card.refit { --acc: var(--blue); align-items: stretch; }
  .card.refit .mini { width: 100%; height: 120px; display: block; margin-top: 14px; }
  .card.refit .card-role { min-height: 0; }
  .card.refit .grow { flex: 1; }
  .card.refit .btn { width: 100%; margin-top: 10px; }
  .card.refit ul { list-style: none; padding: 0; margin: 12px 0 0; font-size: var(--fs-s); color: var(--muted); display: grid; gap: 4px; }
  .card.refit ul b { color: var(--text); font-weight: 600; }

  .diff { border-top: 1px solid var(--line); padding: 10px 18px 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; min-height: 92px; }
  .diff-title { font-size: var(--fs-s); letter-spacing: .1em; color: var(--muted); grid-column: 1 / -1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diff-title b { color: #fff; }
  .diff-title .subs { color: var(--amber); letter-spacing: .02em; }
  .diff-title .buys { color: #fff; letter-spacing: .02em; }
  .diff-title .same { color: var(--dim); }
  .diff-rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 22px; font-size: var(--fs-s); }
  .diff-rows div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diff-rows .g { color: var(--muted); display: inline-block; min-width: 92px; letter-spacing: .05em; }
  .diff-rows .from { color: var(--dim); text-decoration: line-through; }
  .diff-rows .to { color: #fff; }
  .diff-rows .to.sub { color: var(--amber); }
  .diff-rows .same { color: var(--dim); }
  .diff-actions { display: flex; gap: 8px; align-items: end; }
  .diff.idle .diff-rows { color: var(--dim); }

  /* ---------- widok REFIT RĘCZNY ---------- */
  .manual { display: grid; grid-template-columns: minmax(0, 1fr) 480px; grid-template-rows: minmax(0, 1fr) auto; flex: 1; min-height: 0; }
  .m-left { display: flex; flex-direction: column; min-height: 0; padding: 12px 14px 8px 18px; border-right: 1px solid var(--line); }
  .m-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seg { background: transparent; border: 1px solid var(--line-2); color: var(--muted); font-size: var(--fs-xs); letter-spacing: .06em; padding: 5px 8px; cursor: pointer; }
  .seg:hover { color: var(--text); }
  .seg.on { color: #fff; border-color: var(--orange); }
  .seg .n { color: var(--dim); margin-left: 4px; }
  .m-tools .sep { width: 1px; height: 20px; background: var(--line-2); margin: 0 4px; }
  .hull-wrap { flex: 1; min-height: 0; position: relative; margin-top: 8px; }
  #hull { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--fs-xs); color: var(--muted); padding-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 0; }
  .legend span.empty::before { background: transparent; border: 1px dashed #9aa3ad; width: 7px; height: 7px; }
  .legend span.note { color: var(--dim); }
  .legend span.note::before { display: none; }
  .tip {
    position: absolute; pointer-events: none; background: rgba(5, 6, 8, .94); border: 1px solid var(--line-2); padding: 6px 9px; font-size: var(--fs-s);
    white-space: nowrap; display: none; z-index: 5; line-height: 1.45;
  }
  .tip .t1 { color: var(--muted); font-size: var(--fs-xs); letter-spacing: .08em; }
  .m-right { display: flex; flex-direction: column; min-height: 0; padding: 12px 16px 8px; gap: 8px; overflow-y: auto; }
  .sel-head { font-size: var(--fs-s); letter-spacing: .08em; color: var(--muted); }
  .sel-head b { color: #fff; }
  .wlist { flex: 1; min-height: 120px; overflow: auto; border: 1px solid var(--line); }
  .wrow { display: grid; grid-template-columns: minmax(0, 1fr) 64px 54px 46px 44px 54px; gap: 6px; padding: 7px 9px; font-size: var(--fs-s); align-items: center; border-bottom: 1px solid rgba(255,255,255,.04); cursor: pointer; }
  .wrow .price { color: var(--muted); }
  .wrow .nm em { font-style: normal; font-size: var(--fs-xs); color: var(--amber); border: 1px solid rgba(255,170,51,.4); padding: 0 4px; margin-left: 4px; }
  .opt .tag { float: right; color: var(--amber); font-size: var(--fs-xs); margin-left: 8px; }
  .opt.on .tag { color: var(--green); }
  .wrow:hover { background: rgba(255,255,255,.04); }
  .wrow.none { opacity: .45; cursor: default; }
  .wrow.cur { background: rgba(255, 102, 0, .08); }
  .wrow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .wrow .band { font-size: var(--fs-xs); letter-spacing: .05em; text-align: center; border: 1px solid var(--line-2); padding: 1px 0; color: var(--bc, var(--muted)); border-color: var(--bc, var(--line-2)); }
  .wrow .num { text-align: right; color: var(--text); }
  .wrow .cnt { text-align: right; color: var(--muted); }
  .wrow.head { cursor: default; color: var(--dim); font-size: var(--fs-xs); letter-spacing: .06em; position: sticky; top: 0; background: var(--screen); }
  .wrow.head:hover { background: var(--screen); }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .opt { border: 1px solid var(--line-2); padding: 6px 8px; font-size: var(--fs-xs); letter-spacing: .05em; color: var(--muted); cursor: pointer; background: transparent; text-align: left; }
  .opt:hover { color: var(--text); }
  .opt.on { color: #fff; border-color: var(--orange); }
  .opt:disabled { color: var(--dim); border-color: var(--line); cursor: default; }
  .opt small { display: block; color: var(--dim); font-size: var(--fs-xs); margin-top: 2px; letter-spacing: 0; }
  .opt.on small { color: var(--muted); }
  .m-sub { font-size: var(--fs-xs); letter-spacing: .12em; color: var(--dim); margin-top: 4px; }
  .m-bottom { grid-column: 1 / -1; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 18px; padding: 10px 18px 12px; align-items: center; }
  .m-bottom canvas { width: 100%; height: 76px; display: block; }
  .sums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 16px; font-size: var(--fs-s); }
  .sums div span { color: var(--muted); display: block; font-size: var(--fs-xs); letter-spacing: .06em; }
  .sums div b { color: #fff; font-weight: 600; }
  .m-actions { display: flex; flex-direction: column; gap: 6px; }

  .toast {
    position: absolute; left: 50%; top: 58px; transform: translate(-50%, -8px); background: rgba(5,6,8,.95); border: 1px solid var(--orange);
    padding: 8px 14px; font-size: var(--fs-s); letter-spacing: .05em; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .cards { overflow: auto; }
  @media (max-width: 1360px) {
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(118px, 0.45fr); gap: 8px; padding: 10px 12px 8px; }
    .card { padding: 10px 10px 9px; }
    .card-name { font-size: var(--fs-l); }
    .card.refit .mini, .card.refit ul, .card.refit .key { display: none; }
    .card.refit .card-name { font-size: var(--fs-m); }
    .card.refit .card-role { white-space: normal; }
    .chip i { display: none; }
    .stat { grid-template-columns: 1fr auto 48px; gap: 6px; }
    .diff { padding: 8px 12px 10px; }
    .diff-rows { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .manual { grid-template-columns: minmax(0, 1fr) 420px; }
    .wrow { grid-template-columns: minmax(0, 1fr) 58px 50px 40px 38px 50px; gap: 4px; padding: 6px 7px; }
    .opts { grid-template-columns: minmax(0, 1fr); }
    .tabs .list { gap: 22px; }
    .status { gap: 12px; padding: 9px 12px; }
  }
  @media (max-height: 860px) {
    .t-head { padding-bottom: 6px; }
    .t-head .crumb { display: none; }
    .card-role { min-height: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile { height: 58px; }
    .stats { margin-top: 8px; gap: 3px; }
    .chips { margin-top: 6px; }
    .loadout, .fitmap { display: none; }
    .card-foot { margin-top: auto; padding-top: 7px; }
    .diff { min-height: 0; gap: 6px 12px; }
    .diff-rows div:nth-child(n+7) { display: none; }
    .m-bottom canvas { height: 54px; }
    .opt small { display: none; }
    .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opt { padding: 4px 6px; }
    .wlist { min-height: 96px; }
    .m-right { gap: 5px; }
  }
</style>
</head>
<body>
  <div class="mock-bar">
    <span>Makieta · stan gracza:</span>
    <button data-mode="kits" class="on">misja startowa — komplety</button>
    <button data-mode="later">później — bez kompletów, 150 000 CR</button>
  </div>

  <div class="tablet">
    <div class="t-head">
      <div>
        <div class="crumb">TERMINAL STACJI / USŁUGI DOKOWE</div>
        <div class="station">EARTH</div>
        <div class="link">[EARTH] POŁĄCZONO</div>
      </div>
      <div class="right">
        <span class="pill"><span class="dot"></span>ŁĄCZE AKTYWNE</span>
        <span class="pill close">ZAMKNIJ</span>
      </div>
    </div>
    <div class="tabs">
      <span class="arrow">‹</span>
      <div class="list"><span>HANGAR</span><span>HANDEL</span><span>KANTYNA</span><span class="active">WYPOSAŻENIE</span><span>INFRASTRUKTURA</span></div>
      <span class="arrow">›</span>
    </div>

    <div class="screen">
      <div class="status" id="status"></div>

      <div class="view on" id="view-cards">
        <div class="cards" id="cards"></div>
        <div class="diff idle" id="diff"></div>
      </div>

      <div class="view" id="view-manual">
        <div class="manual">
          <div class="m-left">
            <div class="m-tools" id="tools"></div>
            <div class="hull-wrap"><canvas id="hull"></canvas><div class="tip" id="tip"></div></div>
            <div class="legend" id="legend"></div>
          </div>
          <div class="m-right">
            <div class="sel-head" id="sel-head"></div>
            <div class="wlist" id="wlist"></div>
            <div class="m-sub">MODUŁ</div>
            <div class="opts" id="opt-module"></div>
            <div class="m-sub">SYSTEM F</div>
            <div class="opts" id="opt-system"></div>
            <div class="m-sub">CHIPY</div>
            <div class="opts" id="opt-chips"></div>
          </div>
          <div class="m-bottom">
            <div><canvas id="m-profile"></canvas><div class="axis" id="m-axis"></div></div>
            <div class="sums" id="sums"></div>
            <div class="m-actions">
              <button class="btn" id="btn-save">ZAPISZ JAKO WŁASNĄ</button>
              <button class="btn primary" id="btn-back">← KONFIGURACJE</button>
            </div>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>

    <div class="t-foot"><span>KREDYTY <b id="credits">1 200 CR</b></span><span>MODUŁ WYPOSAŻENIE</span><span>ŁADOWNIA <b>0 / 20</b></span></div>
  </div>

  <script type="module" src="./fitowanie-koncept.js"></script>
</body>
</html>
