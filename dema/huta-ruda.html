<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Ścieżki tekstur gry (assets/…) są względne do katalogu głównego. -->
<base href="/">
<link rel="icon" href="data:,">
<title>Huta — stanowisko rudy</title>
<style>
  :root { --ink: #dfe6ea; --muted: #7f8f99; --line: #f0a02033; --panel: #0a0d11e8; --accent: #f0a020; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #030406; overflow: hidden; color: var(--ink); font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
  #root { position: fixed; inset: 0; overflow: hidden; background: #030406; }
  #webgl-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #c { position: absolute; inset: 0; z-index: 1; outline: none; cursor: grab; }
  #panel { position: fixed; right: 10px; top: 10px; z-index: 40; width: 264px; max-height: calc(100vh - 20px); overflow-y: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #panel h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .06em; }
  #panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 0 5px; font-weight: 600; }
  .views { display: grid; gap: 4px; }
  .views button { text-align: left; padding: 5px 9px; }
  .views button small { display: block; color: var(--muted); font-size: 11px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #141a20; color: var(--ink); border: 1px solid #3a2f1c; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: #3a2a10; border-color: var(--accent); color: #fff; }
  .ore i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #counters { font: 11px/1.55 ui-monospace, Consolas, monospace; white-space: pre; color: #c9d3d9; }
  #counters b { color: #fff; font-weight: 600; }
  #counters .dim { color: var(--muted); }
  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #errors { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 60; max-width: 70vw; max-height: 40vh; overflow: auto; padding: 8px; background: #2a0b0bee; border: 1px solid #a33; border-radius: 6px; font: 11px ui-monospace, monospace; white-space: pre-wrap; display: none; }
  body.shot #panel { display: none; }
</style>
</head>
<body>
<div id="root">
  <canvas id="webgl-layer"></canvas>
  <canvas id="c" tabindex="0" aria-label="Stanowisko rudy huty: statek, odkurzacz, kopiec z ziaren w zasieku, taśma do pieca"></canvas>
</div>
<div id="panel">
  <h1>HUTA — STANOWISKO RUDY</h1>
  <div class="sub">Każde ziarno to stan symulacji: ładownia → ssawa → rura → lot → kopiec → taśma.</div>
  <h2>Widok</h2>
  <div class="views" id="views"></div>
  <h2>Ruda</h2>
  <div class="btns" id="ores"></div>
  <h2>Tempo</h2>
  <div class="btns" id="speeds"></div>
  <h2>Liczniki</h2>
  <div id="counters"></div>
  <div class="hint">1–4 — widoki, Spacja — pauza. Widok z góry: przeciągnij — kamera, kółko — zoom. Widoki z ukosa: przeciągnij — obrót, kółko — odległość.</div>
</div>
<div id="errors"></div>
<script type="module" src="/dema/huta-ruda.js"></script>
</body>
</html>
