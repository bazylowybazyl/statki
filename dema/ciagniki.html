<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Ścieżki tekstur gry (assets/…) są względne do katalogu głównego. -->
<base href="/">
<link rel="icon" href="data:,">
<title>Ciągniki kosmiczne</title>
<style>
  :root { --ink: #dfe6ea; --muted: #7f8f99; --line: #f0a02033; --panel: #0a0d11e8; --accent: #f0a020; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #030406; overflow: hidden; color: var(--ink); font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
  #root { position: fixed; inset: 0; overflow: hidden; background: #030406; }
  #webgl-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #c { position: absolute; inset: 0; z-index: 1; outline: none; cursor: grab; }
  #panel { position: fixed; right: 10px; top: 10px; z-index: 40; width: 272px; max-height: calc(100vh - 20px); overflow-y: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #panel h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .views { display: grid; gap: 4px; }
  .views button { text-align: left; padding: 6px 9px; }
  .views button small { display: block; color: var(--muted); font-size: 11px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #141a20; color: var(--ink); border: 1px solid #3a2f1c; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: #3a2a10; border-color: var(--accent); color: #fff; }
  #gallery { width: 100%; padding: 8px; font-weight: 600; letter-spacing: .03em; border-color: var(--accent); margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #info { color: var(--muted); font: 11px/1.5 ui-monospace, Consolas, monospace; margin-top: 8px; white-space: pre-wrap; }
  #errors { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 60; max-width: 60vw; max-height: 40vh; overflow: auto; padding: 8px; background: #2a0b0bee; border: 1px solid #a33; border-radius: 6px; font: 11px ui-monospace, monospace; white-space: pre-wrap; display: none; }
  body.shot #panel { display: none; }
</style>
</head>
<body>
<div id="root">
  <canvas id="webgl-layer"></canvas>
  <canvas id="c" tabindex="0" aria-label="Ciągniki kosmiczne: zestawy z jedną do pięciu naczep w ruchu po łukach"></canvas>
</div>
<div id="panel">
  <h1>CIĄGNIKI KOSMICZNE</h1>
  <button id="gallery">Galeria — zbliżenie</button>
  <h2>Widok</h2>
  <div class="views" id="views"></div>
  <h2>Zoom (jak w grze)</h2>
  <div class="btns" id="zooms"></div>
  <h2>Rozmiar naczepy</h2>
  <div class="btns" id="scales"></div>
  <h2>Tempo</h2>
  <div class="btns" id="speeds"></div>
  <h2>Obraz</h2>
  <div class="btns" id="toggles"></div>
  <div id="info"></div>
  <div class="hint">Kółko — zoom 0,035–3,2, przeciągnij — kamera, Spacja — pauza, 1–5 — widoki, G — galeria, D — nakładki (przeguby, tor).</div>
</div>
<div id="errors"></div>
<script type="module" src="/dema/ciagniki.js"></script>
</body>
</html>
