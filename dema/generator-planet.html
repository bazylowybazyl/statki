<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Ścieżki assetów gry (assets/…, src/…) są względne do katalogu głównego. -->
<base href="/">
<title>Generator planet</title>
<link rel="icon" href="data:,">
<!--
  Demo GENERATORA PLANET (src/3d/planetGen/, opis docs/OPIS-generator-planet.md): planety z ziarna wypiekane na GPU
  (mapy dnia, rzeźby, połysku, nocy i chmur) i pokazane na materiałach generatora nad grafami GRY (planet3d.assets.tsl.js
  z hakami: rzeźba z cieniem terenu, detal ponad mapę, morze, chmury, ruiny; olbrzymy — wspólny silnik żywej
  atmosfery z czapami polarnymi i cieniem pierścieni), post jak w grze (bloom → ACES → sRGB).
  Od razu po otwarciu: siatka 15 losowych planet (widok gry — z góry, słońce z boku). Klik w planetę — zbliżenie
  z obrotem. Serwowanie: `npm run dev` → /dema/generator-planet.html
  Parametry: ?rodzaj=terran|ocean|desert|rocky|ice|volcanic|barren|toxic|gas|ice_giant|mieszane, ?ziarno=N (siatka
  powtarzalna), ?planeta=rodzaj:ziarno (od razu zbliżenie), ?roz=1024|2048|4096 (zbliżenie), ?pora=0…180 (kąt słońca
  od kierunku widoku: 90 — jak w grze), ?test=1 (bez paneli). Harness / konsola: window.__gen.
-->
<style>
  :root { --ink: #dfe6ee; --muted: #7d8aa0; --line: #5fc8ff26; --panel: #070b10e0; --accent: #ffc23a; --cool: #6fd3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink); font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
  #gpu, #over { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #over { pointer-events: none; }
  #gpu { cursor: pointer; touch-action: none; }
  #gpu.drag { cursor: grabbing; }
  #panel { position: fixed; right: 10px; top: 10px; width: 300px; max-height: calc(100vh - 20px); overflow-y: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #panel h1 { font-size: 12px; margin: 0 0 6px; letter-spacing: .1em; font-weight: 600; }
  #panel h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 0 5px; font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #0d141c; color: var(--ink); border: 1px solid #263445; border-radius: 4px; padding: 4px 7px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--cool); }
  button.on { background: #1d2a12; border-color: var(--accent); color: #fff; }
  .row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 40px; gap: 6px; align-items: center; margin: 3px 0; }
  .row output { text-align: right; font: 10.5px ui-monospace, Consolas, monospace; color: #b8c8dc; }
  input[type=range] { width: 100%; }
  input[type=number] { width: 100%; background: #0d141c; color: var(--ink); border: 1px solid #263445; border-radius: 4px; padding: 3px 5px; font: 11px ui-monospace, Consolas, monospace; }
  #info { color: #c3cedb; line-height: 1.45; margin-top: 4px; }
  #info b { color: var(--accent); font-weight: 600; }
  #info .kv { color: var(--muted); font: 10.5px/1.5 ui-monospace, Consolas, monospace; margin-top: 4px; }
  .keys { color: var(--muted); font-size: 10.5px; margin-top: 10px; line-height: 1.6; }
  .keys kbd { font: 10px ui-monospace, Consolas, monospace; border: 1px solid #344458; border-radius: 3px; padding: 0 3px; color: #cfd8e3; }
  #stat { position: fixed; left: 10px; bottom: 8px; color: #7d8aa0b0; font: 10.5px ui-monospace, Consolas, monospace; pointer-events: none; white-space: pre; }
  #err { position: fixed; left: 12px; right: 12px; bottom: 30px; color: #ffc4c4; background: rgba(50, 0, 0, .92); padding: 10px; border-radius: 6px; font: 12px ui-monospace, monospace; white-space: pre-wrap; display: none; }
  body.test #panel, body.test #stat, body.hide #panel { display: none !important; }
  @media (max-width: 720px) { #panel { width: calc(100vw - 20px); top: auto; bottom: 26px; max-height: 45vh; } }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<canvas id="over"></canvas>
<div id="panel">
  <h1>GENERATOR PLANET</h1>
  <h2>Rodzaj</h2>
  <div class="btns" id="types"></div>
  <h2>Ziarno</h2>
  <div class="row"><span>ziarno</span><input id="seed" type="number" min="0" max="4294967295" step="1"><button id="b-seed" title="pokaż planetę z ziarna">→</button></div>
  <div class="btns" style="margin-top:4px"><button id="b-los">losuj</button><button id="b-siatka">siatka</button></div>
  <h2>Widok</h2>
  <div class="btns" id="views"></div>
  <div class="row"><span>słońce</span><input id="s-pora" type="range" min="0" max="180" step="1"><output id="o-pora"></output></div>
  <div class="row"><span>doba</span><input id="s-doba" type="range" min="0" max="1" step="0.01"><output id="o-doba"></output></div>
  <div class="row"><span>atmosfera</span><input id="s-atm" type="range" min="0" max="6" step="0.1"><output id="o-atm"></output></div>
  <div class="btns" style="margin-top:4px"><button id="t-chmury" class="on">chmury</button><button id="t-poswiata" class="on">poświata</button><button id="t-podpisy" class="on">podpisy</button></div>
  <h2>Rozdzielczość zbliżenia</h2>
  <div class="btns" id="res"></div>
  <div id="info"></div>
  <div class="keys">
    <kbd>klik</kbd> zbliżenie · <kbd>LPM</kbd> obrót · <kbd>kółko</kbd> odległość · <kbd>Esc</kbd> siatka ·
    <kbd>R</kbd> losuj · <kbd>D</kbd> doba · <kbd>C</kbd> chmury · <kbd>H</kbd> panele
  </div>
</div>
<div id="stat"></div>
<div id="err"></div>
<script type="module" src="/dema/generator-planet.js"></script>
</body>
</html>
