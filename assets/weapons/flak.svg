<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120">
  <defs>
    <radialGradient id="flak-mantlet" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#33405e" />
      <stop offset="100%" stop-color="#161f33" />
    </radialGradient>
    <linearGradient id="flak-barrel" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5a6982" />
      <stop offset="100%" stop-color="#93a4bd" />
    </linearGradient>
    <radialGradient id="flak-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6dd" />
      <stop offset="40%" stop-color="#ffc258" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff7a1e" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Ammo drums -->
  <ellipse cx="40" cy="44" rx="13" ry="10" fill="#243352" stroke="#0e1424" stroke-width="2" />
  <ellipse cx="40" cy="80" rx="13" ry="10" fill="#243352" stroke="#0e1424" stroke-width="2" />
  <!-- Mantlet -->
  <rect x="30" y="46" width="46" height="32" rx="7" fill="url(#flak-mantlet)" stroke="#0e1424" stroke-width="3" />
  <!-- Twin short barrels -->
  <rect x="74" y="52" width="42" height="7" rx="3" fill="url(#flak-barrel)" />
  <rect x="74" y="65" width="42" height="7" rx="3" fill="url(#flak-barrel)" />
  <!-- Muzzle brakes -->
  <rect x="112" y="49" width="9" height="13" rx="2" fill="#6f7d8c" stroke="#0e1424" stroke-width="1.5" />
  <rect x="112" y="62" width="9" height="13" rx="2" fill="#6f7d8c" stroke="#0e1424" stroke-width="1.5" />
  <!-- Air burst -->
  <circle cx="150" cy="62" r="26" fill="url(#flak-burst)" />
  <circle cx="150" cy="62" r="15" fill="none" stroke="#ffce80" stroke-width="2" opacity="0.7" />
  <circle cx="150" cy="62" r="5" fill="#fff6dd" />
  <!-- Shrapnel -->
  <g stroke="#ffe09e" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M150 62 L166 46" /><path d="M150 62 L170 66" />
    <path d="M150 62 L158 82" /><path d="M150 62 L136 78" />
    <path d="M150 62 L134 50" />
  </g>
  <!-- Base plate -->
  <rect x="20" y="86" width="54" height="8" rx="3" fill="#1a2844" stroke="#0e1424" stroke-width="2" />
</svg>
